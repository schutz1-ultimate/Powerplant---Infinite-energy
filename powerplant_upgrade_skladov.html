&lt;div class=&quot;k&quot;&gt;5 GWh, účinnosť nabíjania 80 %. Nabíjanie spotrebuje elektrinu z výroby, vybíjaním ju vrátiš do siete.&lt;/div&gt;&lt;/div&gt;&lt;/div&gt;

&lt;script&gt;
const DT=1,TOL=200,$=id=&gt;document.getElementById(id);
let S,timer,speed=1,paused=false;
// elektrárne: cap MW, fix = fixný denný náklad (€/deň), vr = prevádzkový náklad/palivo (€/MWh), em = emisie (t CO₂/MWh, približne životný cyklus IPCC)
const PL=[
{k:&#x27;nu&#x27;,n:&#x27;Jadrová elektráreň&#x27;,i:&#x27;☢&#x27;,c:&#x27;var(--nu)&#x27;,cap:1000,fix:408000,vr:8,em:.012,min:50,def:60,note:&#x27;Max. 1000 MW. Min. stabilný výkon 50 %, zmena max. 1 %/min (600 MW/h) podľa požiadaviek EUR. Veľmi vysoký fixný náklad, lacné palivo, ~12 g CO₂/kWh.&#x27;},
{k:&#x27;so&#x27;,n:&#x27;Solárna elektráreň&#x27;,i:&#x27;☀&#x27;,c:&#x27;var(--so)&#x27;,cap:800,fix:30000,vr:0,em:.048,def:100,note:&#x27;Posuvník doprava = vyšší výkon (podiel z dostupného slnka, max. 800 MW). Takmer bez prevádzkových nákladov, ~48 g CO₂/kWh.&#x27;},
{k:&#x27;hy&#x27;,n:&#x27;Vodná elektráreň&#x27;,i:&#x27;💧&#x27;,c:&#x27;var(--ps)&#x27;,cap:350,fix:35000,vr:2,em:.024,note:&#x27;Max. 350 MW, rýchla regulácia. Dostupnosť závisí od ročného obdobia (najviac vody na jar, najmenej v lete a na jeseň). ~24 g CO₂/kWh.&#x27;},
{k:&#x27;wi&#x27;,n:&#x27;Veterná elektráreň&#x27;,i:&#x27;💨&#x27;,c:&#x27;#12a5a5&#x27;,cap:600,fix:40000,vr:3,em:.011,note:&#x27;Max. 600 MW podľa sily vetra (v zime fúka viac, v lete menej). Posuvník = škrtenie výkonu. ~11 g CO₂/kWh.&#x27;},
{k:&#x27;cl&#x27;,n:&#x27;Uhoľná elektráreň&#x27;,i:&#x27;🪨&#x27;,c:&#x27;var(--dem)&#x27;,cap:600,fix:70000,vr:95,em:.82,min:40,note:&#x27;Max. 600 MW. Pri chode min. 40 %, zmena 300 MW/h, rozbeh z vypnutého stavu 6 h. Palivo + povolenky ~95 €/MWh, ~820 g CO₂/kWh. Posuvník úplne vľavo = vypnutá.&#x27;},
{k:&#x27;ga&#x27;,n:&#x27;Plynová elektráreň&#x27;,i:&#x27;🔥&#x27;,c:&#x27;#e8741e&#x27;,cap:500,fix:25000,vr:85,em:.49,min:30,note:&#x27;Max. 500 MW. Pri chode min. 30 %, zmena 400 MW/h, rozbeh 1 h. Palivo + povolenky ~85 €/MWh, ~490 g CO₂/kWh. Posuvník úplne vľavo = vypnutá.&#x27;},
{k:&#x27;oi&#x27;,n:&#x27;Ropná elektráreň&#x27;,i:&#x27;🛢&#x27;,c:&#x27;#9c6b3c&#x27;,cap:300,fix:15000,vr:150,em:.72,min:30,note:&#x27;Max. 300 MW. Pri chode min. 30 %, zmena 300 MW/h, rozbeh 1 h. Najdrahšie palivo ~150 €/MWh, ~720 g CO₂/kWh. Núdzový zdroj. Posuvník úplne vľavo = vypnutá.&#x27;}];

// Orientačné modelové nákupné ceny palív (nie živé trhové kotácie).
// Jednotky: jadro kg obohateného uránového paliva, uhlie t, plyn MWh tepelné, ropa barel.
const FUEL={
 nu:{name:&#x27;Jadrové palivo&#x27;,unit:&#x27;kg&#x27;,price:2100,perMWh:0.0025,capacity:180,initial:45,batch:15,other:6},
 cl:{name:&#x27;Energetické uhlie&#x27;,unit:&#x27;t&#x27;,price:115,perMWh:0.43,capacity:12000,initial:2500,batch:1000,other:45},
 ga:{name:&#x27;Zemný plyn&#x27;,unit:&#x27;MWhₜ&#x27;,price:43,perMWh:1.95,capacity:18000,initial:3500,batch:1500,other:12},
 oi:{name:&#x27;Vykurovací olej&#x27;,unit:&#x27;barel&#x27;,price:76,perMWh:0.42,capacity:9000,initial:1200,batch:700,other:90}
};
function fuelCapacity(k){return S?.fuelCapacity?.[k] ?? FUEL[k]?.capacity ?? 0;}
function fuelUpgradeInfo(k){const f=FUEL[k];if(!f||!S)return null;const level=S.fuelUpgrades?.[k]||0;const increase=Math.round(f.capacity*0.5);const price=Math.round(f.capacity*f.price*0.12*Math.pow(1.65,level));return {level,capacity:fuelCapacity(k),increase,price};}
function upgradeFuelStorage(k){const info=fuelUpgradeInfo(k);if(!info||S.over)return {ok:false,message:&#x27;Upgrade nie je dostupný.&#x27;};if(S.money&lt;info.price)return {ok:false,message:&#x27;Nedostatok peňazí na rozšírenie skladu (&#x27;+info.price.toLocaleString(&#x27;sk-SK&#x27;)+&#x27; €).&#x27;};S.money-=info.price;S.fuelCapacity[k]=info.capacity+info.increase;S.fuelUpgrades[k]=info.level+1;return {ok:true,message:&#x27;Sklad rozšírený na &#x27;+S.fuelCapacity[k].toLocaleString(&#x27;sk-SK&#x27;)+&#x27; &#x27;+FUEL[k].unit+&#x27;.&#x27;};}
function fuelBuy(k,amount){const f=FUEL[k];if(!f||!S||S.over)return {ok:false,message:&#x27;Nedostupné&#x27;};
 const q=Math.min(Math.max(0,Math.floor(Number(amount)||0)),Math.floor(fuelCapacity(k)-S.fuel[k]));const cost=Math.round(q*f.price);
 if(!q)return {ok:false,message:&#x27;Sklad je plný.&#x27;};if(S.money&lt;cost)return {ok:false,message:&#x27;Nedostatok peňazí (&#x27;+cost.toLocaleString(&#x27;sk-SK&#x27;)+&#x27; €).&#x27;};
 S.money-=cost;S.fuel[k]+=q;return {ok:true,message:&#x27;Nakúpené &#x27;+q.toLocaleString(&#x27;sk-SK&#x27;)+&#x27; &#x27;+f.unit+&#x27; za &#x27;+cost.toLocaleString(&#x27;sk-SK&#x27;)+&#x27; €.&#x27;};}
function fuelLimit(k,requested){const f=FUEL[k];if(!f)return requested;const actual=Math.max(0,Math.min(requested,S.fuel[k]/(f.perMWh*DT)));
 S.fuel[k]=Math.max(0,S.fuel[k]-actual*f.perMWh*DT);return actual;}

const TH={cl:{min:.4,ramp:300,wu:6},ga:{min:.3,ramp:400,wu:1},oi:{min:.3,ramp:300,wu:1}};
const BAT_FIX=20000,FIXH=(PL.reduce((a,P)=&gt;a+P.fix,0)+BAT_FIX)/24;
const CAPOF=k=&gt;PL.find(p=&gt;p.k===k).cap;
$(&#x27;pg&#x27;).innerHTML=PL.map(p=&gt;`&lt;div class=&quot;pc&quot;&gt;&lt;b style=&quot;color:${p.c}&quot;&gt;${p.i} ${p.n}&lt;/b&gt;
&lt;div class=&quot;row&quot;&gt;&lt;span&gt;Výkon: &lt;b id=&quot;${p.k}A&quot;&gt;0&lt;/b&gt; MW&lt;/span&gt;&lt;span id=&quot;${p.k}R&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;input type=&quot;range&quot; id=&quot;${p.k}&quot; min=&quot;${p.k===&#x27;nu&#x27;?50:0}&quot; max=&quot;100&quot; value=&quot;${p.def||0}&quot;&gt;
&lt;div class=&quot;row&quot;&gt;&lt;span&gt;◀ menší výkon&lt;/span&gt;&lt;span&gt;väčší výkon ▶&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;row&quot;&gt;&lt;span&gt;Denný náklad: &lt;b id=&quot;${p.k}C&quot;&gt;0&lt;/b&gt;&lt;/span&gt;&lt;span id=&quot;${p.k}S&quot;&gt;&lt;/span&gt;&lt;/div&gt;
&lt;div class=&quot;k&quot;&gt;${p.note}&lt;/div&gt;&lt;/div&gt;`).join(&#x27;&#x27;);

$ui('cancelBuild').onclick=()=>{selectedBuild=null;selectedCategory=null;world.contentWindow?.PowerplantConstruction?.setTool(null);$ui('buildPalette').hidden=true;$ui('buildStatus').textContent='Vyber kategóriu stavania';document.querySelectorAll('[data-category]').forEach(b=>b.classList.remove('selected'))};
function toggleDrawer(id,force){const el=$ui(id);el.classList.toggle('closed',force===undefined?!el.classList.contains('closed'):!force)}
$ui('toggleLeft').onclick=()=>toggleDrawer('leftDrawer');$ui('toggleRight').onclick=()=>toggleDrawer('rightDrawer');$ui('closeLeft').onclick=()=>toggleDrawer('leftDrawer',false);$ui('closeRight').onclick=()=>toggleDrawer('rightDrawer',false);
function renderPlants(){const frame=sim.contentWindow,eng=engine(),holder=$ui('ownedPlants');if(!eng?.getPlants()||!eng?.getState())return;const plants=eng.getPlants(),fuels=eng.getFuelConfig?.()||{};if(holder.children.length===plants.length)return;holder.innerHTML='';for(const p of plants){const card=document.createElement('div');card.className='plantCard';const title=document.createElement('div');title.className='plantTitle';title.textContent=p.i+' '+p.n;const meta=document.createElement('div');meta.className='plantMeta';const output=document.createElement('span');output.id='out-'+p.k;const percent=document.createElement('span');percent.id='pct-'+p.k;meta.append(output,percent);const slider=document.createElement('input');slider.type='range';slider.min=p.k==='nu'?50:0;slider.max=100;slider.value=frame.document.getElementById(p.k)?.value||0;slider.dataset.plant=p.k;slider.oninput=()=>{const source=frame.document.getElementById(p.k);if(source)source.value=slider.value;percent.textContent=slider.value+' %'};const note=document.createElement('small');note.textContent='Nastavenie cieľového výkonu';card.append(title,meta,slider,note);
 if(fuels[p.k]){const f=fuels[p.k];const expand=document.createElement('button');expand.textContent='▸ Palivo a sklad';expand.style.cssText='width:100%;margin-top:9px;text-align:left';const detail=document.createElement('div');detail.hidden=true;detail.id='fuel-'+p.k;detail.style.cssText='padding:10px 0;font-size:12px';expand.onclick=()=>{detail.hidden=!detail.hidden;expand.textContent=(detail.hidden?'▸':'▾')+' Palivo a sklad'};const info=document.createElement('div');info.id='fuelinfo-'+p.k;detail.append(info);const buy=document.createElement('button');buy.textContent='Kúpiť '+f.batch.toLocaleString('sk-SK')+' '+f.unit+' · '+(f.batch*f.price).toLocaleString('sk-SK')+' €';buy.style.cssText='width:100%;margin-top:8px';buy.onclick=()=>{const res=engine()?.buyFuel(p.k,f.batch);showToast(res?.message||'Nákup zlyhal.');updateFuelInfo()};detail.append(buy);const upgrade=document.createElement('button');upgrade.id='upgrade-'+p.k;upgrade.style.cssText='width:100%;margin-top:7px;background:#25574e;border-color:#58bfa2';upgrade.onclick=()=>{const res=engine()?.upgradeFuelStorage(p.k);showToast(res?.message||'Upgrade zlyhal.');updateFuelInfo();updateDashboard()};detail.append(upgrade);card.append(expand,detail)}holder.append(card)}}
function updateFuelInfo(){const eng=engine(),st=eng?.getState(),fuels=eng?.getFuelConfig?.()||{};if(!st)return;for(const [k,f] of Object.entries(fuels)){const el=$ui('fuelinfo-'+k);if(!el)continue;const q=st.fuel?.[k]||0;const mw=Number(sim.contentWindow.document.getElementById(k+'A')?.textContent)||0;const hours=mw>0?q/(mw*f.perMWh):0;const upgrade=eng.getFuelUpgradeInfo?.(k);const cap=upgrade?.capacity??f.capacity;const upgradeButton=$ui('upgrade-'+k);if(upgradeButton&&upgrade){upgradeButton.textContent='⬆ Rozšíriť sklad +'+upgrade.increase.toLocaleString('sk-SK')+' '+f.unit+' · '+upgrade.price.toLocaleString('sk-SK')+' € (úroveň '+(upgrade.level+1)+')';upgradeButton.disabled=st.money<upgrade.price||st.over;}el.textContent='Sklad: '+q.toLocaleString('sk-SK',{maximumFractionDigits:1})+' / '+cap.toLocaleString('sk-SK')+' '+f.unit+' ('+Math.round(q/cap*100)+' %) · Cena: '+f.price.toLocaleString('sk-SK')+' €/'+f.unit+' · Spotreba: '+(mw*f.perMWh).toFixed(2)+' '+f.unit+'/h · Zásoba na '+(mw?hours.toFixed(1)+' h':'—')+' · Výkon: '+mw+' MW';}}

function updateDashboard(){const st=engine()?.getState(),frame=sim.contentWindow;if(!st)return;renderPlants();updateFuelInfo();syncPauseButton();const d=new Date(2026,10,6,Math.floor(st.t||0)),hour=((Math.floor(st.t||0)%24)+24)%24;const date=d.toLocaleDateString('sk-SK',{day:'numeric',month:'long',year:'numeric'});$ui('uiDate').textContent=date;updateTopClock(st.t||0);updateWeatherUI(st);updateTopIndicators(st);$ui('uiMoney').textContent=(st.money/1e6).toFixed(2).replace('.',',')+' M€';const today=st.money-st.dayStart;const monthStart=new Date(d.getFullYear(),d.getMonth(),1);const hoursFromMonth=Math.max(1,(d-monthStart)/3600000);const monthly=st.days?.slice(-Math.min(30,Math.ceil(hoursFromMonth/24)))?.reduce((a,b)=>a+b,0)||0;const fields=[['Dátum',date],['Herný čas',String(hour).padStart(2,'0')+':00'],['Bankový účet',euro(st.money)],['Príjem dnes',euro(today)],['Výsledok včera',st.last==null?'—':euro(st.last)],['Výsledok tento mesiac (orientačný)',euro(monthly+today)],['Celkový zisk / strata',euro(st.money-(engine()?.getStartMoney()||5000000))],['Emisie CO₂',Math.round(st.em||0).toLocaleString('sk-SK')+' t'],['Spokojnosť',Math.round(st.sat||0)+' %'],['Vyrobená / dodaná energia',((st.served||0)).toFixed(1)+' GWh'],['Znečistenie ovzdušia',Math.round(st.air||0)+' t/h']];const details=$ui('details');details.replaceChildren();for(const [label,value] of fields){const row=document.createElement('div');row.className='detailRow';const a=document.createElement('span'),b=document.createElement('strong');a.textContent=label;b.textContent=value;row.append(a,b);details.append(row)}for(const p of engine()?.getPlants()||[]){const output=$ui('out-'+p.k),percent=$ui('pct-'+p.k);if(output)output.textContent=frame.document.getElementById(p.k+'A')?.textContent+' MW';if(percent)percent.textContent=frame.document.getElementById(p.k)?.value+' %'}}
setInterval(updateDashboard,700);
world.addEventListener('load',()=>{world.contentWindow.addEventListener('powerplant:buildNotice',e=>showToast(e.detail.message));world.contentWindow.addEventListener('powerplant:constructionChanged',e=>{engine()?.setMoney(e.detail.money);showToast('Stavba bola pridaná na mapu.')});world.contentWindow.addEventListener('powerplant:worldGenerated',()=>{$ui('cancelBuild').click()})});


const daylight={rise:[7.3,6.8,6,5.8,5,4.6,4.8,5.4,6,6.6,6.5,7.2],set:[16.2,17.2,18,19.6,20.5,21.2,21,20.2,19,17.7,16.3,15.8]};
const dialPoint=(h,r)=>{const a=h/24*Math.PI*2-Math.PI/2;return [50+r*Math.cos(a),50+r*Math.sin(a)]};
function dialArc(a,b,r){const p=dialPoint(a,r),q=dialPoint(b,r);return `M ${p[0]} ${p[1]} A ${r} ${r} 0 ${b-a>12?1:0} 1 ${q[0]} ${q[1]}`}
function dialWedge(a,b){const p=dialPoint(a,45),q=dialPoint(b,45);return `M50 50 L${p[0]} ${p[1]} A45 45 0 ${b-a>12?1:0} 1 ${q[0]} ${q[1]} Z`}
for(let i=0;i<24;i++){const a=dialPoint(i,37),b=dialPoint(i,i%6===0?44:41);const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',a[0]);line.setAttribute('y1',a[1]);line.setAttribute('x2',b[0]);line.setAttribute('y2',b[1]);$ui('clockTicks').append(line)}
let lastClockMonth=-1,clockVisual=0,clockTarget=0,clockLastFrame=performance.now();
function updateTopClock(t){clockTarget=t;const d=new Date(2026,10,6,Math.floor(t)),mon=d.getMonth();if(mon!==lastClockMonth){lastClockMonth=mon;const a=daylight.rise[mon],b=daylight.set[mon];$ui('clockDay').setAttribute('d',dialWedge(a,b));$ui('clockNight').setAttribute('d',dialWedge(b,a+24));$ui('clockDayRim').setAttribute('d',dialArc(a,b,46));$ui('clockNightRim').setAttribute('d',dialArc(b,a+24,46))}const h=((t%24)+24)%24;}
function animateClock(now){
 const dt=Math.min(.1,(now-clockLastFrame)/1000);clockLastFrame=now;
 const paused=engine()?.isPaused()===true;
 // Po pauze sa ručička zastaví okamžite, bez dobiehania animácie.
 if(paused){clockVisual=clockTarget}
 else if(clockTarget<clockVisual-1){clockVisual=clockTarget}
 else {const rate=Math.max(.1,engine()?.getSpeed?.()||1)*2.2;clockVisual+=Math.min(Math.max(0,clockTarget-clockVisual),dt*rate)}
 $ui('clockHand').setAttribute('transform',`rotate(${clockVisual*15} 50 50)`);
 requestAnimationFrame(animateClock)
}requestAnimationFrame(animateClock);
function syncPauseButton(){const paused=engine()?.isPaused()||false;const btn=$ui('pauseClock');btn.textContent=paused?'▶':'⏸';btn.title=paused?'Pokračovať v simulácii':'Pozastaviť simuláciu';btn.setAttribute('aria-pressed',String(paused))}
$ui('pauseClock').addEventListener('click',()=>{const simEngine=engine();if(!simEngine)return;simEngine.togglePause();syncPauseButton()});
$ui('customSpeed').addEventListener('change',e=>{
 const parsed=Number(String(e.target.value).replace(',','.'));
 const value=Math.max(.1,Math.min(100,Number.isFinite(parsed)&&parsed>0?parsed:1));
 e.target.value=String(value);engine()?.setSpeed(value)
});
sim.addEventListener('load',()=>{engine()?.setSpeed(Number($ui('customSpeed').value)||1);syncPauseButton()});
function updateTopIndicators(st){
 const sat=Math.max(0,Math.min(100,st.sat??0)),b=st.satBreakdown||{},direction=(b.delta||0)>0.005?'rastie':(b.delta||0)<-0.005?'klesá':'je stabilná';
 const fmt=n=>Number(n||0).toFixed(2).replace('.',',');
 const tips=`SPOKOJNOSŤ: ${fmt(sat)} % — ${direction} (${b.delta>=0?'+':''}${fmt(b.delta)} bodu/h)\nCieľová spokojnosť: ${fmt(b.target??100)} %\nZnečistenie ovzdušia: −${fmt(b.pollution)} bodu\nVýpadky: −${fmt(b.blackout)} bodu\nNedostatok dodávky: −${fmt(b.shortfall)} bodu\nAktuálne znečistenie: ${fmt(b.air)} t/h\nSpokojnosť sa postupne približuje k cieľovej hodnote.`;
 $ui('topSatValue').textContent=Math.round(sat)+' %';$ui('topSatBar').style.width=sat+'%';$ui('topSatBar').style.background=sat<35?'#ee6565':sat<65?'#e5b348':'#39bc7a';$ui('topSatBar').parentElement.parentElement.title=tips;
 const em=Math.round(st.em||0),e=st.emBreakdown||{},names={nu:'Jadrová',so:'Solárna',hy:'Vodná',wi:'Veterná',cl:'Uhoľná',ga:'Plynová',oi:'Ropná',backup:'Náhradná výroba pri deficite'};
 const lines=Object.entries(names).map(([k,name])=>`${name}: ${fmt(e[k])} t CO₂/h`);
 $ui('topEmValue').textContent=em.toLocaleString('sk-SK')+' t';
 $ui('topEmissions').title=`EMISIE CO₂: ${em.toLocaleString('sk-SK')} t celkom\nAktuálny prírastok: +${fmt(st.emRate)} t/h\n\nPríspevky podľa zdrojov:\n${lines.join('\n')}\n\nEmisie sú kumulatívne, preto neklesajú; znížiť možno rýchlosť ich pribúdania. Model zahŕňa životný cyklus zdrojov.`;
 const detail=$ui('details');if(detail){const rows=detail.querySelectorAll('.detailRow');for(const row of rows){const name=row.querySelector('span')?.textContent||'';if(name.includes('Spokojnosť'))row.title=tips;if(name.includes('Emisie'))row.title=$ui('topEmissions').title;}}
}
function updateWeatherUI(st){const w=engine()?.getWeather(),banner=$ui('weatherBanner');banner.hidden=!w;if(!w)return;$ui('weatherTitle').textContent=w.icon+' '+w.name+' · '+Math.max(0,Math.ceil((w.until-st.t)/24))+' dní';$ui('weatherDesc').textContent=w.desc+' · Hydro '+Math.round((w.hy-1)*100)+' %, solár '+Math.round((w.so-1)*100)+' %, vietor '+Math.round((w.wi-1)*100)+' %, odber '+Math.round((w.dm-1)*100)+' %';banner.title='Environmentálna udalosť — každých 7 herných dní. '+w.desc}
function syncNavHeight(){document.documentElement.style.setProperty('--nav-height',document.querySelector('.nav').getBoundingClientRect().height+'px')}
new ResizeObserver(syncNavHeight).observe(document.querySelector('.nav'));syncNavHeight();
window.PowerplantBridge.isCoastal=()=>{const api=map(),st=api?.getState();if(!st?.startCity)return false;const c=st.cities.find(x=>x.id===st.startCity);if(!c)return false;for(let r of [150,300,500])for(let j=0;j<16;j++){const a=j*Math.PI/8,t=api.getTerrain(c.x+r*Math.cos(a),c.y+r*Math.sin(a));if(t&&t.e<=.43)return true}return false};

world.addEventListener('load',()=>world.contentWindow.addEventListener('powerplant:plantSelected',e=>{toggleDrawer('leftDrawer',true);renderPlants();const k=e.detail.type;const el=$ui('fuel-'+k);if(el){el.hidden=false;el.parentElement.scrollIntoView({behavior:'smooth',block:'center'});}else showToast('Elektráreň: '+(e.detail.type||'štartovacia'));}));
