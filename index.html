function damageDisasterArea(w,center,coastal){
 const api=map(),st=api?.getState(),build=world.contentWindow?.PowerplantConstruction;if(!st||!build)return;

 const items=build.getItems?.()||[],links=build.getLinks?.()||[];
 const near=items.filter(i=>Math.hypot(i.x-center.x,i.y-center.y)<radius);
 // Katastrofa nastavuje presne tie isté stavy ako poruchy a preťaženie.
 // Oprava potom prebieha v pôvodnom detaile elektrárne/rozvádzača/úložiska.
 const hit=near.sort(()=>Math.random()-.5).slice(0,Math.min(collapsed?Math.max(4,Math.ceil(near.length*.4)):4,near.length));
 for(const item of hit){
  item.failed=true;item.failureCause=w.name;item.actualMW=0;item.heat=0;
  disaster.repairs.push({id:item.id,name:item.name||build.catalog?.[item.type]?.label||'Zariadenie',x:item.x,y:item.y,item});
 }
 // Poškodené káble využívajú existujúcu opravu po kliknutí na kábel.
 const byId=new Map(items.map(i=>[i.id,i]));
 const cableCandidates=links.filter(l=>!l.broken&&!l.water&&(()=>{const a=byId.get(l.a),b=byId.get(l.b);return a&&b&&Math.hypot((a.x+b.x)/2-center.x,(a.y+b.y)/2-center.y)<radius})());
 for(const link of cableCandidates.slice(0,Math.min(2,cableCandidates.length))){
  link.broken=true;link.flow=0;link.heat=0;
 }
 if(hit.length||cableCandidates.length){
  showToast(w.icon+' '+w.name+' — poškodené objekty ('+hit.length+') a vedenia ('+Math.min(2,cableCandidates.length)+'). Oprav ich priamo na mape.');
 }else showToast(w.icon+' '+w.name+' — v zasiahnutej oblasti neboli žiadne stavby.');

 api.redraw?.();
}

const dialPoint=(h,r)=>{const a=h/24*Math.PI*2-Math.PI/2;return [50+r*Math.cos(a),50+r*Math.sin(a)]};
function dialArc(a,b,r){const p=dialPoint(a,r),q=dialPoint(b,r);return `M ${p[0]} ${p[1]} A ${r} ${r} 0 ${b-a>12?1:0} 1 ${q[0]} ${q[1]}`}
function dialWedge(a,b){const p=dialPoint(a,45),q=dialPoint(b,45);return `M50 50 L${p[0]} ${p[1]} A45 45 0 ${b-a>12?1:0} 1 ${q[0]} ${q[1]} Z`}

function animateClock(now){
 const dt=Math.min(.1,(now-clockLastFrame)/1000);clockLastFrame=now;
 const paused=engine()?.isPaused()===true;
 // Po pauze sa ručička zastaví okamžite, bez dobiehania animácie.
 if(paused){clockVisual=clockTarget}
 else if(clockTarget<clockVisual-1){clockVisual=clockTarget}
 else {const rate=Math.max(.1,engine()?.getSpeed?.()||1)*2.2;clockVisual+=Math.min(Math.max(0,clockTarget-clockVisual),dt*rate)}
 $ui('clockHand').setAttribute('transform',`rotate(${clockVisual*15} 50 50)`);
 requestAnimationFrame(animateClock)

<script>
// Detailed company metrics: hover summaries and click-through analytics.
const metricNames={nu:'Jadrové',so:'Solárne',hy:'Vodné',wi:'Veterné',cl:'Uhoľné',ga:'Plynové',oi:'Ropné'};
const companyMetrics={lastT:0,lastMoney:null,operatingNet:0,positiveRevenue:0,negativeOperation:0,fuelSpend:0,plantRevenue:{nu:0,so:0,hy:0,wi:0,cl:0,ga:0,oi:0},plantFuel:{nu:0,so:0,hy:0,wi:0,cl:0,ga:0,oi:0},co2History:[],satHistory:[],lastSampleHour:-1,knownFuel:new Map(),lastWorldSeed:null};
const metricModal=document.getElementById('metricModal'),metricBody=document.getElementById('metricModalBody'),metricPopover=document.getElementById('metricPopover');
const fmtEuro=n=>(n<0?'−':'')+new Intl.NumberFormat('sk-SK',{maximumFractionDigits:0}).format(Math.abs(Math.round(n||0)))+' €';
const fmtSigned=n=>(n>=0?'+':'−')+new Intl.NumberFormat('sk-SK',{maximumFractionDigits:0}).format(Math.abs(Math.round(n||0)))+' €';
const card=(label,value,kind='')=>`<div class="metric-card ${kind}"><span>${label}</span><b>${value}</b></div>`;
function currentPlants(){return (world.contentWindow?.PowerplantConstruction?.getItems?.()||[]).filter(p=>metricNames[p.type])}
function investmentBreakdown(){const build=world.contentWindow?.PowerplantConstruction,catalog=build?.catalog||{},items=build?.getItems?.()||[],links=build?.getLinks?.()||[];const out={plants:0,storage:0,switches:0,cables:0,total:0};for(const item of items){const cost=Number(catalog[item.type]?.cost)||0;if(metricNames[item.type])out.plants+=cost;else if(['battery','pumped'].includes(item.type))out.storage+=cost;else if(String(item.type).startsWith('switch')||item.type==='junction')out.switches+=cost}for(const link of links)out.cables+=Number(link.cost)||Number(catalog[link.type]?.cost)||0;out.total=out.plants+out.storage+out.switches+out.cables;return out}
function updateCompanyMetrics(st){if(!st)return;const seed=map()?.getSeed?.();if(seed&&companyMetrics.lastWorldSeed!==seed){companyMetrics.lastWorldSeed=seed;companyMetrics.lastMoney=st.money;companyMetrics.lastT=st.t||0;companyMetrics.knownFuel.clear()}
 const t=Number(st.t)||0,money=Number(st.money)||0,dt=Math.max(0,t-companyMetrics.lastT);if(companyMetrics.lastMoney!==null&&dt>0){const delta=money-companyMetrics.lastMoney;companyMetrics.operatingNet+=delta;if(delta>=0)companyMetrics.positiveRevenue+=delta;else companyMetrics.negativeOperation+=-delta;const plants=currentPlants(),total=plants.reduce((s,p)=>s+Math.max(0,Number(p.actualMW)||0),0);if(delta>0&&total>0)for(const p of plants)companyMetrics.plantRevenue[p.type]+=delta*Math.max(0,Number(p.actualMW)||0)/total}
 const build=world.contentWindow?.PowerplantConstruction;for(const p of currentPlants()){const f=build?.getPlantFuel?.(p.id);if(!f)continue;const old=companyMetrics.knownFuel.get(p.id);if(old&&f.stock>old.stock+0.01){const bought=f.stock-old.stock,spent=bought*f.price;companyMetrics.fuelSpend+=spent;companyMetrics.plantFuel[p.type]+=spent}companyMetrics.knownFuel.set(p.id,{stock:f.stock,type:p.type})}
 companyMetrics.lastMoney=money;companyMetrics.lastT=t;const hour=Math.floor(t);if(hour!==companyMetrics.lastSampleHour){companyMetrics.lastSampleHour=hour;companyMetrics.co2History.push({t,rate:Number(st.emRate)||0,total:Number(st.em)||0});companyMetrics.satHistory.push({t,value:Number(st.sat)||0});if(companyMetrics.co2History.length>720)companyMetrics.co2History.shift();if(companyMetrics.satHistory.length>720)companyMetrics.satHistory.shift()}}
function moneyStats(st){const start=engine()?.getStartMoney?.()||5000000,t=Math.max(0,Number(st.t)||0),today=st.money-st.dayStart,elapsed=Math.max(1,t%24),hourly=today/elapsed,days=[...(st.days||[]),today],avgDay=days.length?days.reduce((a,b)=>a+b,0)/days.length:0;return{start,t,today,hourly,avgDay,month:avgDay*30,total:st.money-start,best:days.length?Math.max(...days):0,worst:days.length?Math.min(...days):0,bestDay:days.length?days.indexOf(Math.max(...days))+1:1,worstDay:days.length?days.indexOf(Math.min(...days))+1:1}}
function popRows(rows){return rows.map(([a,b])=>`<div class="pop-row"><span>${a}</span><b>${b}</b></div>`).join('')}
function positionPopover(target){const r=target.getBoundingClientRect(),w=350;metricPopover.style.left=Math.max(12,Math.min(innerWidth-w-12,r.left+r.width/2-w/2))+'px';metricPopover.style.top=Math.min(innerHeight-metricPopover.offsetHeight-12,r.bottom+9)+'px'}
function showMoneyPopover(target){const st=engine()?.getState();if(!st)return;const q=moneyStats(st);metricPopover.innerHTML='<h4>💶 Financie spoločnosti</h4>'+popRows([['Stav účtu',fmtEuro(st.money)],['Dnes',fmtSigned(q.today)],['Priemer za hodinu',fmtSigned(q.hourly)],['Priemer za deň',fmtSigned(q.avgDay)],['Odhad za mesiac',fmtSigned(q.month)],['Od začiatku',fmtSigned(q.total)]])+'<small>Klikni pre podrobný rozpis</small>';metricPopover.classList.add('visible');positionPopover(target)}
function satisfactionData(){const st=map()?.getState(),cities=st?.cities?.filter(c=>c.unlocked)||[],values=cities.map(c=>Number(c.satisfaction)||0),coverage=cities.map(c=>Math.min(100,(Number(c.suppliedMW)||0)/Math.max(1,map().getDemand(c.id,engine()?.getState()?.t||0))*100));return{cities,avg:values.length?values.reduce((a,b)=>a+b,0)/values.length:100,min:values.length?Math.min(...values):100,max:values.length?Math.max(...values):100,coverage:coverage.length?coverage.reduce((a,b)=>a+b,0)/coverage.length:0}}
function showSatPopover(target){const s=satisfactionData(),st=engine()?.getState();metricPopover.innerHTML='<h4>😊 Spokojnosť obyvateľov</h4>'+popRows([['Celkový priemer',Math.round(s.avg)+' %'],['Najspokojnejšie mesto',Math.round(s.max)+' %'],['Najmenej spokojné mesto',Math.round(s.min)+' %'],['Priemerné pokrytie',Math.round(s.coverage)+' %'],['Zmena za poslednú hodinu',(Number(st?.satBreakdown?.delta)||0).toFixed(2)+' b.']])+'<small>Klikni pre podrobný rozpis miest</small>';metricPopover.classList.add('visible');positionPopover(target)}

function hideMetricPopover(){metricPopover.classList.remove('visible')}
function openMetric(title,subtitle,icon,html,draw){document.getElementById('metricModalTitle').textContent=title;document.getElementById('metricModalSubtitle').textContent=subtitle;document.getElementById('metricModalIcon').textContent=icon;metricBody.innerHTML=html;metricModal.showModal();requestAnimationFrame(()=>draw?.())}
function openMoneyDetail(){const st=engine()?.getState();if(!st)return;const q=moneyStats(st),inv=investmentBreakdown(),rows=Object.keys(metricNames).map(k=>{const count=currentPlants().filter(p=>p.type===k).length,gross=companyMetrics.plantRevenue[k],fuel=companyMetrics.plantFuel[k];return count?`<tr><td>${metricNames[k]} (${count}×)</td><td>${fmtEuro(gross)}</td><td>${fmtEuro(-fuel)}</td><td>${fmtSigned(gross-fuel)}</td></tr>`:''}).join('');openMetric('Podrobné financie','Príjmy, výdavky a výsledky spoločnosti','💶',`${economyDetail(st)}<div class="metric-grid">${card('Stav účtu',fmtEuro(st.money),st.money>=0?'positive':'negative')}${card('Dnes',fmtSigned(q.today),q.today>=0?'positive':'negative')}${card('Za hodinu',fmtSigned(q.hourly),q.hourly>=0?'positive':'negative')}${card('Priemer / deň',fmtSigned(q.avgDay),q.avgDay>=0?'positive':'negative')}${card('Priemer / mesiac',fmtSigned(q.month),q.month>=0?'positive':'negative')}${card('Od začiatku',fmtSigned(q.total),q.total>=0?'positive':'negative')}</div><h3 class="metric-section-title">Denné rekordy</h3><div class="metric-grid">${card('Najlepší deň','Deň '+q.bestDay+' · '+fmtSigned(q.best),'positive')}${card('Najslabší deň','Deň '+q.worstDay+' · '+fmtSigned(q.worst),q.worst>=0?'':'negative')}${card('Nákup paliva',fmtEuro(-companyMetrics.fuelSpend),'negative')+card('Emisné pokuty tento mesiac',fmtEuro(-(st.environment?.paid||0)),'negative')}</div><h3 class="metric-section-title">Elektrárne podľa typu</h3>${rows?`<table class="detail-table"><thead><tr><th>Typ</th><th>Príjem</th><th>Palivo</th><th>Výsledok</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="emptyMetric">Zatiaľ nie sú postavené žiadne elektrárne.</div>'}<h3 class="metric-section-title">Investície do siete</h3><div class="metric-grid">${card('Elektrárne',fmtEuro(-inv.plants),'negative')}${card('Úložiská',fmtEuro(-inv.storage),'negative')}${card('Rozvádzače',fmtEuro(-inv.switches),'negative')}${card('Káble',fmtEuro(-inv.cables),'negative')}${car function environmentalSmoke(now){
 requestAnimationFrame(environmentalSmoke);
 if(now-lastEnvironmentalFrame<80)return;lastEnvironmentalFrame=now;
 const doc=world.contentDocument,viewport=doc?.getElementById('viewport');
 if(!viewport)return;
 if(envAttachedTo!==viewport){viewport.append(envCanvas);envAttachedTo=viewport;}
 const frame=viewport.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
 if(envCanvas.width!==Math.round(frame.width*dpr)||envCanvas.height!==Math.round(frame.height*dpr)){envCanvas.width=Math.round(frame.width*dpr);envCanvas.height=Math.round(frame.height*dpr)}
 envCtx.setTransform(dpr,0,0,dpr,0,0);envCtx.clearRect(0,0,frame.width,frame.height);
 const e=environmentalState();if(!e)return;
 const damage=Math.max(0,Math.min(1,e.damage||0));
 // Atmosféra sa mení výlučne pri TRVALOM poškodení; aktuálna výroba ani mesačné emisie ju nefarbia.
 if(damage<=0)return;
 const level=damage<.25?1:damage<.5?2:damage<.75?3:4;
 const alpha=[0,.075,.14,.22,.30][level]*Math.min(1,damage/.15);
 envCtx.fillStyle='rgba(113,100,80,'+alpha+')';envCtx.fillRect(0,0,frame.width,frame.height);
 // Rozsiahle pohyblivé vrstvy zákalu, nezávislé od polohy elektrární.
 const patches=level*4;
 for(let n=0;n<patches;n++){
  const x=((n*197+now*(.0018+n%3*.0008))%(frame.width+500))-250;
  const y=((n*131+Math.sin(now/14000+n*2)*60)%(frame.height+320))-160;
  const r=100+level*43+(n%3)*34;
  const g=envCtx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'rgba(100,90,78,'+(alpha*.38)+')');
  g.addColorStop(1,'rgba(100,90,78,0)');
  envCtx.fillStyle=g;envCtx.fillRect(x-r,y-r,r*2,r*2);
 }
 // Pri oddialení mapy vidno rozsiahle pohyblivé oblačné pásy.
 // Pri detailnom priblížení ustupujú, aby nezakrývali stavby.
 const zoom=world.contentWindow?.PowerplantMap?.getZoom?.()||1;
 const zoomVisibility=Math.max(0,Math.min(1,(1.05-zoom)/.55));
 const cloudOpacity=zoomVisibility*Math.max(0,(damage-.08))*[0,.22,.33,.45,.57][level];
 if(cloudOpacity>.002){
  envCtx.save();
  const cloudCount=4+level*3;
  for(let n=0;n<cloudCount;n++){
   const size=75+level*30+(n%4)*28;
   const x=((n*251+now*(.0028+(n%3)*.0013))%(frame.width+size*4))-size*2;
   const y=((n*137+Math.sin(now/17000+n*1.7)*28)%(frame.height+size*3))-size*1.5;

   for(let k=0;k<4;k++){
    const cx=(k-1.5)*size*.32,cy=Math.sin(n*3+k)*size*.14;
    const r=size*(.62+(k%2)*.12);

    const a=cloudOpacity*(.65+(k%3)*.12);
    grad.addColorStop(0,'rgba(191,185,166,'+a+')');
    grad.addColorStop(.55,'rgba(163,158,148,'+(a*.48)+')');
    grad.addColorStop(1,'rgba(147,143,137,0)');
    envCtx.fillStyle=grad;envCtx.fillRect(cx-r,cy-r,r*2,r*2);
   }
   envCtx.restore();
  }
  envCtx.restore();
 }
 if(level>=3){

  }
 }
 // Informácia o poškodení je v detaile CO₂, nie nad legendou mapy.

<p class="tutorialLead">Priveď elektrinu do všetkých miest a vybuduj sieť, ktorá dokáže fungovať aj zajtra.</p>
<p>Grid Architect spája stavbu elektrickej siete, hospodárenie a starostlivosť o obyvateľov aj krajinu. Nestačí postaviť veľkú elektráreň: energiu musíš dopraviť správnym smerom, udržať zariadenia funkčné a zaplatiť palivo aj prevádzku.</p>
<h3>Ako vyhráš</h3><ul><li>Vlastníš <strong>všetky mestá na mape</strong>.</li><li>Celková spokojnosť obyvateľov je <strong>nad 70 %</strong>. Je vážená počtom obyvateľov, takže veľké mestá majú väčší vplyv.</li><li>Prebehne ďalšia herná hodina so zapnutým časom a aktualizuje sa spokojnosť. Nákup všetkých miest počas pauzy sám o sebe výhru nespustí.</li></ul>
<p>Po výhre môžeš pokračovať v budovaní alebo sa vrátiť do hlavného menu. Praktickým cieľom je stabilná dodávka do každého mesta, nie iba krátkodobo pekné číslo spokojnosti.</p>
<div class="tutorialTip"><strong>Odporúčaný prvý svet:</strong> Gigantická mapa s 10 mestami. Menšia sieť sa ľahšie učí spravovať. Maximá sú 100 miest pre Gigantickú, 150 pre Monumentálnu a 200 pre Nekonečnú mapu.</div>
<p>Tento návod môžeš čítať po kapitolách alebo vybrať tému v obsahu. Počas čítania je rozbehnutá hra pozastavená.</p>`},
{title:'Ovládanie mapy a času',tag:'Orientácia',html:`
<h3>Mapa</h3><ul><li><strong>Pravé tlačidlo + ťahanie:</strong> posun mapy.</li><li><strong>Koliesko myši:</strong> priblíženie a oddialenie. Budovy a káble patria do sveta, pri vzdialení preto vyzerajú menšie.</li><li><strong>Ľavý klik na objekt:</strong> jeho informácie a ovládanie v paneli vpravo.</li><li><strong>Esc:</strong> zrušenie rozostavanej akcie alebo zatvorenie panelu podľa aktuálneho režimu.</li></ul>
<h3>Čas</h3><p>Pri hodinách hore nájdeš pauzu a násobiteľ rýchlosti. Rozsah je <strong>0,1× až 10×</strong>. Na začiatku používaj 1×; pri prepájaní a plánovaní pokojne pauzu. Zvýšenie rýchlosti urýchľuje aj spotrebu paliva, výpadky, účty a udalosti.</p>
<p>Počas pauzy môžeš pripravovať sieť, ale výroba, finančné vyúčtovanie a spokojnosť sa ukážu v ďalších herných hodinách. Po zmene zapojenia preto čas znovu spusti a skontroluj výsledok.</p>
<h3>Kde čo nájdeš</h3><ul><li><strong>Spodná stavebná lišta:</strong> elektrárne, úložiská, káble, rozvádzače a správa siete.</li><li><strong>Elektrárne:</strong> prehľad objektov, ich stavu, paliva a výroby.</li><li><strong>Štatistiky:</strong> podrobnejší stav spoločnosti a prehľady udalostí.</li><li><strong>Peniaze, spokojnosť a CO₂ hore:</strong> prejdenie myšou zobrazí stručné údaje; klik otvorí podrobnosti.</li><li><strong>Súbor:</strong> uloženie, načítanie a návrat do hlavného menu.</li></ul>`},
{title:'Prvé mesto: postup krok za krokom',tag:'Prvá funkčná sieť',html:`
<ol><li><strong>Vygeneruj svet.</strong> Vyber veľkosť, počet miest a prípadne seed.</li><li><strong>Vyber si prvé mesto zadarmo.</strong> Klikni na mesto a potvrď jeho výber. Prečítaj si aktuálny odber a denný priebeh spotreby.</li><li><strong>Pozastav čas.</strong> Plánovanie prvej prípojky nemusí obyvateľov stáť ďalšie hodiny bez elektriny.</li><li><strong>Postav zdroj.</strong> Vyber elektráreň v spodnej ponuke a umiestni ju na vhodné miesto. Zadaj meno alebo nechaj doplniť náhodné.</li><li><strong>Pripoj výstup elektrárne ku vstupu mesta.</strong> Ak potrebuješ viac vetiev, vlož rozvádzač. Postup zapojenia nájdeš v ďalšej kapitole.</li><li><strong>Otvor elektráreň.</strong> Nastav požadovaný výkon nad nulu. Pri palivovom zdroji over zásobu paliva.</li><li><strong>Spusti čas na 1×.</strong> Po ďalšej hodine otvor mesto a porovnaj dodávané MW s aktuálnou spotrebou.</li><li><strong>Sleduj aspoň celý deň.</strong> Denná špička alebo noc môže odhaliť nedostatok, ktorý pri prvom zapnutí nevidíš.</li></ol>
<div class="tutorialTip"><strong>Prvá kontrola úspechu:</strong> mesto dostáva energiu, zdroj skutočne vyrába, vedenie nie je preťažené a máš peniaze na ďalšiu prevádzku. Až potom kupuj ďalšie mesto.</div>
<p>Nekupuj hneď všetko, na čo máš hotovosť. Každé ďalšie mesto treba pripojiť; nedodaná elektrina stojí peniaze a postupne znižuje spokojnosť.</p>`},
{title:'Káble, vstupy a rozvádzače',tag:'Ako tečie elektrina',html:`
<div class="tutorialFlow">Výstup elektrárne → kábel → vstup rozvádzača → výstup rozvádzača → vstup mesta</div>
<p>Elektrická sieť je smerová. Začni na <strong>výstupe zdroja</strong> a skonči na <strong>vstupe odberateľa</strong>. Dve budovy blízko seba ani čiary, ktoré sa na obrazovke križujú, ešte nezaručujú funkčné spojenie.</p>
<ol><li>V stavebnej ponuke vyber kábel s vhodnou kapacitou.</li><li>Vyber výstup východiskového objektu a potom vstup cieľového objektu.</li><li>Pri potrebe vetvenia použi rozvádzač alebo uzol a jednotlivé úseky dokonči ako skutočné pripojenia.</li><li>V menu zariadenia skontroluj názvy pri vstupoch a výstupoch: ukazujú, odkiaľ energia prichádza a kam odchádza.</li><li>Po spustení času skontroluj tok a prípadné poškodenie.</li></ol>
<h3>Hľadaj najslabší článok</h3><p>Prenos obmedzuje kábel, konkrétny vstup alebo výstup aj ďalšie prvky po ceste. Ak máš zdroj 600 MW, ale vetvu s kapacitou 100 MW, samotné zvýšenie výroby nestačí. V paneli nastav limity portov a podľa potreby postav silnejšie vedenie alebo rozdeľ sieť do vetiev.</p>
<p>Káble sa musia vyhnúť mestám a budovám. Pri blokovanej trase zmeň vedenie alebo rozmiestnenie siete. Presun budovy môže ovplyvniť existujúce spojenia, preto ich následne skontroluj.</p>
<div class="tutorialTip">Veľká nadvýroba nie je náhrada za správne zapojenie. Sleduj aj tepelné zaťaženie a bezpečný limit siete mesta, aby si ju nepoškodil.</div>`},
{title:'Elektrárne a riadenie výkonu',tag:'Výroba',html:`
<p>Klikni na elektráreň na mape alebo v zozname Elektrárne. Vpravo nastavíš požadovaný výkon, limity výstupov, palivo, sklad a opravy. <strong>Požadovaný výkon nie je záruka skutočnej výroby.</strong></p>
<div class="tutorialTable"><table><thead><tr><th>Zdroj</th><th>Čo spravovať</th></tr></thead><tbody>
<tr><td>Solárny</td><td>Nevyžaduje palivo, ale závisí od denného svetla a podmienok. V noci potrebuješ iný zdroj alebo zásobu energie.</td></tr>
<tr><td>Veterný</td><td>Nevyžaduje palivo; počasie mení dostupný výkon. Nenechaj celú sieť závisieť od jednej priaznivej situácie.</td></tr>
<tr><td>Vodný</td><td>Výkon ovplyvňujú podmienky a prietok. Nádrž môže slúžiť ako zásoba vody pre pripojenú vodnú elektráreň.</td></tr>
<tr><td>Jadrový</td><td>Potrebuje jadrové palivo. Nízka emisná stopa stále vyžaduje zásoby, prevádzkový rozpočet a funkčné vedenie.</td></tr>
<tr><td>Uhoľný, plynový, ropný</td><td>Potrebuješ priebežne kupovať palivo. Sleduj čistý zisk aj mesačné emisie; lacnejšia stavba nemusí znamenať výhodnú dlhodobú prevádzku.</td></tr>
</tbody></table></div>
<h3>Prečo vyrába menej, než čakáš?</h3><p>Skontroluj nastavenie výkonu, palivo, technickú poruchu, počasie, trvalé poškodenie prostredia a občianske udalosti. Potom over prenosové limity. Text „Výroba 0 MW“ je signál na kontrolu konkrétnej príčiny, nie automaticky na stavbu ďalšej elektrárne.</p>
<p>Mená budov používaj prakticky, napríklad podľa regiónu a úlohy. „Sever – nočná záloha“ sa v zozname aj pri portoch hľadá ľahšie než množstvo podobných názvov.</p>`},
{title:'Palivo, sklady a autobuy',tag:'Zásobovanie',html:`
<p>Palivové elektrárne spaľujú zásoby podľa výroby. Otvor ich menu a sleduj <strong>zásobu, kapacitu a spotrebu za hodinu</strong>. Orientačný čas do vyčerpania zistíš delením aktuálnej zásoby aktuálnou hodinovou spotrebou; po zmene výkonu sa tento odhad mení.</p>
<ol><li>V sekcii paliva zadaj požadované množstvo a potvrď nákup.</li><li>Porovnaj cenu doplnenia s dostupnými peniazmi. Nezabudni na ostatné zdroje a účty.</li><li>Ak dokupuješ príliš často, rozšír sklad. Väčší sklad zvyšuje kapacitu, samotné palivo treba naďalej kupovať.</li></ol>
<h3>Automatický nákup</h3><p>V menu každej palivovej elektrárne môžeš draho odomknúť autobuy a potom ho zapínať či vypínať. Pri zásobe <strong>pod 35 %</strong> sa pokúsi doplniť sklad <strong>do 90 %</strong>.</p>
<p>Odomknutie nie je predplatné paliva: každá ďalšia dodávka sa platí zvlášť. Ak chýbajú peniaze, kúpi dostupné množstvo alebo čaká. Preto potrebuješ hotovostnú rezervu aj po automatizácii. Autobuy pri vypnutej alebo pokazenej elektrárni nenahrádza opravu či nastavenie výkonu.</p>
<div class="tutorialTip">Automatizáciu kupuj až vtedy, keď jej vysoká jednorazová cena neohrozí dodávky a prevádzkový rozpočet. Správca oblasti vie odomknutia nakúpiť hromadne, ale neposkytuje palivo zadarmo.</div>`},
{title:'Batérie a prečerpávacie nádrže',tag:'Ukladanie energie',html:`
<h3>Batéria: zapojenie</h3><p>Priveď do jej vstupu elektrinu a jej výstup pripoj k sieti, ktorá ju má využívať. Nenabitá batéria nie je ďalšia elektráreň. V paneli sleduj uloženú energiu, kapacitu, nabíjanie a dodávanie.</p>
<h3>Dva prevádzkové režimy</h3><ul><li><strong>Časovač:</strong> v hrubo vyznačenom časovom úseku sa batéria iba vybíja; mimo neho sa iba nabíja.</li><li><strong>Nabíjanie aj dodávanie:</strong> dovolí obe činnosti súčasne podľa pripojenej siete. Neznamená to vytváranie energie zadarmo.</li></ul>
<p>Na časovej osi posuň dva body na požadované hodiny. Body cez seba neprechádzajú. Prepínač denného/nočného okna určuje, či je vybíjanie <strong>medzi bodmi</strong>, alebo <strong>po stranách cez polnoc</strong>; nemení význam hrubej čiary. Aktuálny režim vychádza z hodiny a zvoleného nastavenia.</p>
<p>Príklad: pri slnečnej výrobe môžeš zvoliť vybíjanie cez polnoc od večera do rána. Cez deň sa batéria nabíja. Posuvníkom rýchlosti vybíjania obmedzíš výkon, aby zásoba vydržala dlhšie.</p>
<div class="tutorialTip"><strong>Výkon a energia sú odlišné veci.</strong> Zásoba 1 000 MWh vystačí pri odbere 100 MW približne na 10 hodín, pri 200 MW na 5 hodín. Je to orientačný príklad bez ďalšieho nabíjania a strát; skutočný tok obmedzuje zapojenie aj nastavenia.</div>
<h3>Prečerpávacia nádrž</h3><p>Nádrž je zásobník vody, nie zmenšená vodná elektráreň. V jej paneli spravuj režim, zásobu vody a vypúšťanie. Pripoj ju vodným prepojením k vodnej elektrárni a over, že voda skutočne tečie. Samotné umiestnenie nádrže vedľa elektrárne prepojenie nenahrádza.</p>`},
{title:'Mestá, dopyt a rozširovanie',tag:'Dodávky obyvateľom',html:`
<p>V paneli mesta nájdeš aktuálnu spotrebu, dodávané MW, pokrytie, bezpečný limit a priebeh odberu počas dňa. <strong>Plánuj podľa špičky, nie iba podľa odberu v okamihu nákupu.</strong></p>
<ol><li>Pred nákupom ďalšieho mesta skontroluj jeho spotrebu a cenu.</li><li>Naplánuj dostupný zdroj, káble a kapacitu celej trasy.</li><li>Po kúpe mesto čo najskôr pripoj a spusti čas.</li><li>Over dodávky vo viacerých hodinách, hlavne počas špičky a v noci.</li></ol>
<p>Mestá ti za nedodanú energiu účtujú náhrady. Dlhšie a väčšie výpadky sa postupne prejavia aj na spokojnosti a nákladoch. Nákup mesta bez zabezpečeného napájania preto nie je iba jednorazová investícia.</p>
<h3>Bezpečnosť siete</h3><p>Nezamieňaj odber mesta s jeho bezpečným limitom siete. Nadmerný prenos môže mesto poškodiť. Nastav výstupy a vetvy tak, aby si dodal potrebnú energiu bez zbytočného preťažovania.</p>
<p>Filtre mapy pomôžu zobraziť iba vlastnené mestá alebo zmeniť zobrazenie názvov. Pri kontrole cieľa hry však nezabudni aj na zatiaľ nekúpené mestá.</p>`},
{title:'Peniaze, výsledok a bankrot',tag:'Ekonomika',html:`
<p>Hotovosť a zisk nie sú to isté. Môžeš mať ziskovú prevádzku, no po veľkej výstavbe málo peňazí na palivo. Alebo vysoký zostatok, zatiaľ čo tvoja sieť každý deň stráca.</p>
<h3>Čítanie financií</h3><ul><li>Príjmy súvisia so skutočne dodanou elektrinou. Samotná výroba bez užitočnej dodávky ti dobrý výsledok nezaručí.</li><li>Do nákladov patria prevádzka, palivo, náhrady mestám a prípadné pokuty.</li><li>Peniaze a prevádzkové finančné štatistiky sa vyúčtujú po <strong>12 herných hodinách</strong>. Nové nastavenie nehodnoť iba podľa jednej sekundy po kliknutí.</li><li>Nákupy a predaje stavieb menia hotovosť, ale neskresľujú denný prevádzkový výsledok. V podrobnostiach odlišuj investície od prevádzky.</li></ul>
<h3>Bankrot</h3><div class="tutorialFlow">Dlh &gt; predajná hodnota celého majetku + 4 000 000 € → prehra</div>
<p>Predajná hodnota nie je pôvodná nákupná cena. V detailoch financií si over aktuálnu hranicu bankrotu. Predaj alebo zníženie nákladov rieš včas, keď ešte dokážeš zachrániť funkčnú sieť.</p>
<div class="tutorialTip">Nechaj si rezervu na viac doplnení paliva a nečakanú opravu. Každé rozšírenie najprv posúď podľa očakávanej dodávky, nákladov a dosahu na emisie.</div>`},
{title:'Emisie, pokuty a poškodenie sveta',tag:'Životné prostredie',html:`
<p>Klikni hore na <strong>CO₂</strong>. Detail ukazuje mesačné emisie, ich tempo, odhad do konca mesiaca, limity a pokuty. Rozpočet sa škáluje podľa odberu všetkých vlastnených miest, preto nepoužívaj jeden pevný limit pre každý svet.</p>
<h3>Mesačné emisie nie sú trvalé poškodenie</h3><p>Mesačný emisný rozpočet vychádza z priemerného odberu vlastnených miest, počtu hodín mesiaca a intenzity 0,130 t/MWh. Tabuľka v hre ukazuje aktuálne hranice jednotlivých stupňov a týždenné pokuty.</p>
<p>Prvá pokuta sa účtuje pri prekročení limitu, ďalšie každých 7 dní. Dosiahnutý stupeň už do konca mesiaca neklesne ani po vypnutí zdrojov. Zostávajúca platba, ktorá by zasiahla do ďalšieho mesiaca, sa uhradí predčasne na konci mesiaca. Nový mesiac vynuluje mesačné emisie a pokutový stupeň, nie poškodenú krajinu.</p>
<h3>Kedy sa poškodzuje svet natrvalo?</h3><p>Riziková záťaž pribúda, keď súčasne dosiahneš <strong>aspoň tretí emisný stupeň</strong> a tvoje aktuálne denné tempo prekračuje <strong>denný limit trvalého poškodzovania</strong>. Ten je tiež odvodený od veľkosti vlastnených miest a je vypísaný v emisnom detaile.</p>
<p>Po <strong>168 nazbieraných hodinách</strong> tejto záťaže vznikne najmenej 15 % trvalé poškodenie. Rizikové hodiny sa sčítavajú aj po prerušení a medzi mesiacmi. Ďalšia záťaž poškodenie zvyšuje; prechod na čistejšiu výrobu zastaví rast, už vzniknuté poškodenie však mesačný reset neodstráni.</p>
<p>Znečistenie postupne znižuje spokojnosť, zhoršuje výrobné podmienky a zvyšuje riziko katastrof. Pri 100 % poškodení prichádza kolaps: výrazný útlm zdrojov závislých od prostredia, časté katastrofy a mimoriadne náklady.</p>
<div class="tutorialTip">Sleduj mesačný odhad aj denný limit poškodzovania. Obmedz zbytočnú nadvýrobu a priprav čisté zdroje skôr, než nazbieraš rizikové hodiny. Aj čisté zdroje majú v hre malú emisnú stopu.</div>`},
{title:'Spokojnosť a občianske nepokoje',tag:'Obyvatelia',html:`
<p>Spokojnosť sa mení postupne. Ovplyvňuje ju pokrytie odberu, dĺžka a opakovanie výpadkov aj znečistenie. Klik na ukazovateľ spokojnosti otvorí rozpis miest a príčin.</p>
<ul><li><strong>30–49 %:</strong> malé riziko štrajku technikov a oneskorených opráv.</li><li><strong>15–29 %:</strong> občiansky bojkot so znížením príjmu alebo blokáda s obmedzením výkonu.</li><li><strong>1–14 %:</strong> vandalizmus, protesty a dočasné odstávky.</li><li><strong>0 %:</strong> pri najbližšom dennom posúdení mimo ochrannej prestávky nastane generálny protest.</li></ul>
<h3>Napätie sa zbiera, nemusí prepuknúť hneď</h3><p>Pod 20 % spokojnosti rastie napätie o 10 bodov denne; nad 50 % postupne klesá. Denná šanca udalosti závisí od spokojnosti a nahromadeného napätia. Reaguj už na varovanie v konkrétnom meste.</p>
<p>Jedno mesto zasiahne najbližšiu elektráreň, pri vážnych nepokojoch najviac dve najbližšie v lokálnom dosahu. Odstávka môže trvať až 7 dní. Kým občianska udalosť trvá, ďalšia sa nespustí; po obnovení prevádzky nasleduje spoločná prestávka 2–7 dní.</p>
<h3>Ako zareagovať</h3><ol><li>Najprv odstráň príčinu: obnov elektrinu a rieš znečistenie.</li><li>V menu mesta môžeš investovať do komunity/PR: zníži napätie a dočasne pomáha. Cenu si skontroluj pred potvrdením.</li><li>Dočasná cenová úľava pomáha upokojiť napätie výmenou za nižší príjem.</li><li>Pri proteste priprav náhradnú dodávku. Technická oprava sama osebe občiansku odstávku neukončí.</li></ol>`},
{title:'Poruchy, katastrofy a opravy',tag:'Keď sa niečo zastaví',html:`
<p>Pokazená elektráreň je mimo prevádzky a nevyrába. Poškodené vedenie, uzol alebo rozvádzač môže prerušiť cestu energie, hoci samotný zdroj vyzerá v poriadku.</p>
<ol><li>Klikni na zasiahnutý objekt a prečítaj si stav.</li><li>Pri technickej poruche zaplať opravu v jeho paneli. Skontroluj aj peniaze a prípadné dočasné blokovanie opráv.</li><li>Pri občianskej odstávke sleduj čas návratu; ide o dočasný účinok udalosti, nie bežnú poruchu.</li><li>Po oprave a spustení času over obnovenie toku až do mesta.</li></ol>
<h3>Environmentálne udalosti</h3><p>Počasie môže meniť výrobu a spotrebu. Tornáda poškodzujú sieť, požiare sa šíria a tsunami prichádzajú od mora. Pri silne poškodenom prostredí hrozí aj toxický vzduch a ďalšie zlé podmienky. Požiare a tsunami sa môžu objaviť aj v čistom svete, ale riziko na začiatku je nízke.</p>
<p>Prejdi myšou nad oznámením udalosti pre jej aktuálne účinky. Klikom otvoríš prehľad; nájdeš ho aj v Štatistikách. Prehľad eviduje unikátne zažité udalosti a počet výskytov. Neobjavené udalosti sú zatmavené s ???.</p>
<div class="tutorialTip">Záloha musí byť schopná energiu aj dopraviť. Rezervná elektráreň za tým istým prerušeným vedením nepomôže mestu na druhej strane poruchy.</div>`},
{title:'Skupiny a manažérske budovy',tag:'Väčšia sieť',html:`
<h3>Prehľadné skupiny</h3><p>V zozname Elektrárne vytvoríš pravým klikom vlastnú skupinu, pomenuješ ju a presunieš do nej elektrárne. Ručne vytvorenú skupinu môžeš premenovať alebo odstrániť. Skupina je organizačný nástroj; sama nič neopravuje ani nenakupuje.</p>
<h3>Správa oblasti</h3><ol><li>Postav a pomenuj manažérsku budovu.</li><li>V jej paneli vyber zakreslenie oblasti a klikmi pridaj aspoň tri rohy.</li><li>Uisti sa, že budova leží <strong>vnútri oblasti</strong>. Potvrď platný nepretínajúci sa tvar.</li><li>Skontroluj príplatok za plochu a kapacitu siete v oblasti.</li><li>Samostatne odomkni a zapni automatické opravy alebo kúp hromadný autobuy pre palivové elektrárne.</li></ol>
<p>Budovy majú kapacity <strong>8 000, 16 000 a 24 000 MW</strong>. Posudzuje sa najvyššia hodnota z menovitej výroby, špičkového odberu miest a kapacity prívodov. Veľká oblasť preto nie je automaticky vhodná pre najmenšie centrum.</p>
<p>Za plochu sa dopláca; zväčšenie môže stáť ďalšie peniaze a zmenšenie ich nevracia. Pri prekročení kapacity, neplatnej oblasti alebo poškodenej budove sa automatizácia zastaví.</p>
<p>Autorepair má veľmi drahé jednorazové odomknutie a <strong>každá samotná oprava sa ďalej platí</strong>. Hromadný autobuy je súčet odomknutí chýbajúcich palivových elektrární, nie lacné palivo. V automaticky vytvorenej skupine nájdeš manažérsku budovu navrchu.</p>`},
{title:'Ukladanie a bezpečný postup k výhre',tag:'Dlhodobý plán',html:`
<h3>Ulož celý svet</h3><p>V ponuke <strong>Súbor → Stiahnuť uloženú hru</strong> si ulož súbor do zariadenia. Obsahuje svet, budovy, peniaze, čas, nastavenia úložísk, oblasti správy aj prebiehajúce udalosti. Načítanie je dostupné počas hry aj z úvodnej obrazovky.</p>
<p>Pred návratom do hlavného menu si hru ulož, ak chceš pokračovať neskôr. Návrat ukončí aktuálnu reláciu; nenahrádza stiahnutie uloženého súboru.</p>
<h3>Od jednej prípojky k celému svetu</h3><ol><li>Stabilizuj prvé mesto počas celého dňa a noci.</li><li>Vybuduj rezervu výkonu, paliva, prenosovej kapacity a hotovosti.</li><li>Rozširuj sa po zvládnuteľných regiónoch. Nové mesto pripoj, potom sleduj prevádzku a financie.</li><li>Pred väčším rastom skontroluj mesačný emisný odhad, denné riziko poškodzovania a spokojnosť.</li><li>Automatizáciu pridávaj až pri dostatočnej finančnej rezerve.</li><li>Priveď elektrinu do posledných miest. Keď všetky vlastníš a celková spokojnosť prekročí 70 %, nechaj prebehnúť ďalšiu hernú hodinu.</li></ol>
<div class="tutorialTip">Pred veľkou prestavbou alebo drahým rozšírením si urob nový uložený súbor. Návod si môžeš kedykoľvek znovu otvoriť tlačidlom Návod.</div>`},
{title:'Rýchla diagnostika problémov',tag:'Keď nevieš, čo ďalej',html:`
<h3>Mesto nedostáva elektrinu</h3><p>Je odomknuté? Vedie úplná trasa z výstupu zdroja do jeho vstupu? Vyrába zdroj? Nie je niekde porucha, protest, zablokovaná trasa alebo nízky limit portu či kábla? Po oprave zapojenia spusti čas.</p>
<h3>Elektráreň stojí</h3><p>Skontroluj výkon nad nulou, palivo, technickú poruchu a čas do konca odstávky. Pri obnoviteľných zdrojoch pozri hodinu, počasie a stav prostredia. Pri toxickom vzduchu bežná oprava nerieši prebiehajúcu evakuáciu.</p>
<h3>Batéria sa vybíja v nesprávnom čase</h3><p>Over, že používa časovač. Hrubá čiara vždy znamená vybíjanie. Prepni vnútorný úsek alebo vonkajšie úseky cez polnoc, skontroluj body a aktuálnu hodinu. Ak potrebuješ súčasné nabíjanie a dodávanie, vyber samostatný režim.</p>
<h3>Výroby je dosť, ale mám stratu</h3><p>Porovnaj výrobu so skutočne dodanou elektrinou. Otvor financie a skontroluj palivo, údržbu, náhrady mestám a pokuty. Vyčkaj na 12-hodinové vyúčtovanie. Zbytočná nadvýroba spotrebúva palivo aj emisný rozpočet.</p>
<h3>Po vypnutí fosílnych zdrojov stále platím pokuty</h3><p>Dosiahnutý emisný stupeň platí do konca mesiaca. Zníženie výroby obmedzí ďalšie emisie, ale už vyrubené mesačné záväzky nezruší.</p>
<h3>Mám všetky mestá a nevyhral som</h3><p>Celková spokojnosť musí byť striktne nad 70 %. Nechaj čas bežať, aby sa aktualizovala pri dokončení hernej hodiny. Ak ukazovateľ klesá, najprv obnov stabilné dodávky a odstráň príčiny nespokojnosti.</p>`}

function openTutorial(){if(tutorialDialog.open)return;tutorialFocus=document.activeElement;const e=engine();tutorialResumeState=window.powerplantWorldReady&&e&&!e.isPaused()&&!e.getState()?.over?e.getState():null;if(tutorialResumeState)e.pause();renderTutorialChapter(tutorialIndex);tutorialDialog.showModal();syncPauseButton();tutorialDialog.querySelector('#tutorialClose').focus()}

const guidePlantTypes=new Set(['nu','so','hy','wi','cl','ga','oi']);
let gameGuide=null,guideWorld=null,guideMarks=[],guideStepReady=false;
function guideContext(){const w=map()?.getState(),items=plantData()?.getItems?.()||[],cities=w?.cities||[],city=cities.find(c=>c.id===gameGuide?.cityId)||cities.find(c=>c.id===w?.startCity)||cities.filter(c=>c.unlocked).sort((a,b)=>a.pop-b.pop)[0];return {w,items,cities,city,plants:items.filter(i=>guidePlantTypes.has(i.type)),doc:world.contentDocument,s:engine()?.getState()}}
function guidePanel(){const d=world.contentDocument,p=d?.getElementById('panel');return p&&!p.hidden?p:null}
function guideHasRoute(c){if(!c.city)return false;const links=(plantData()?.getLinks?.()||[]).filter(l=>!l.water&&!l.broken&&!l.routeBlocked),seen=new Set(c.plants.map(i=>i.id)),queue=[...seen];for(let n=0;n<queue.length;n++){if(queue[n]===c.city.id)return true;for(const l of links)if(l.a===queue[n]&&!seen.has(l.b)){seen.add(l.b);queue.push(l.b)}}return false}
function guideOwnedPanel(c){return !!(c.city&&guidePanel()?.querySelector('#cityCivilPanel')&&guidePanel().textContent.includes(c.city.name))}
function guidePickCity(c){return c.city||c.cities.slice().sort((a,b)=>a.pop-b.pop)[0]}
function guideFocusCity(c){const city=guidePickCity(c);if(city){plantData().setTool(null);plantData().focusCivilCity(city.id)}}
function guideFeedAdvice(c){const peak=c.city?Math.max(...Array.from({length:24},(_,h)=>map().getDemand(c.city.id,h)||0)):0,safe=Number(c.city?.damageLimitMW)||Math.ceil(peak*1.2);return {safe,suggested:Math.max(1,Math.min(safe,Math.ceil(peak*1.1)))}}
