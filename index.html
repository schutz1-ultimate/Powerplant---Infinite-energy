 if(holder.dataset.signature===signature){for(const p of plants){const el=holder.querySelector('[data-fuel-id=\"'+p.id+'\"]');if(el){const f=build?.getPlantFuel?.(p.id);if(f)el.textContent='⛽ '+f.stock.toLocaleString('sk-SK',{maximumFractionDigits:2})+' / '+f.capacity.toLocaleString('sk-SK')+' '+f.unit+' · spotreba '+((p.actualMW||0)*f.perMWh).toFixed(2)+' '+f.unit+'/h';}}return;}
 holder.dataset.signature=signature;holder.replaceChildren();
 if(!plants.length){holder.innerHTML='<div class="mutedUi">Zatiaľ nevlastníš žiadnu elektráreň. Vyber si prvé mesto alebo postav elektráreň cez spodnú lištu.</div>';return}
 for(const p of plants){
  const card=document.createElement('div');card.className='plantCard';
  const title=document.createElement('div');title.className='plantTitle';title.textContent=(catalog[p.type]?.icon||'⚡')+' '+(p.name||catalog[p.type]?.label||'Elektráreň');card.append(title);
  const meta=document.createElement('div');meta.className='plantMeta';const output=document.createElement('span');const percent=document.createElement('span');meta.append(output,percent);card.append(meta);
  if(p.type==='starter'){output.textContent='Štartovacia elektráreň';percent.textContent='250 MW';}
  else{
   const slider=document.createElement('input');slider.type='range';slider.min=0;slider.max=100;slider.value=p.target??100;
   const update=()=>{output.textContent='Výroba: '+Math.round(p.outputMW||0)+' MW';percent.textContent='Cieľ: '+Math.round(p.target??100)+' %'+(p.failed?' · ⚠ porucha':'')};
   slider.oninput=()=>{build?.setPlantTarget?.(p.id,+slider.value);update()};card.append(slider);update();
   const note=document.createElement('small');note.textContent='Výkon a prehrievanie sa počítajú podľa spojenia s káblovou sieťou.';card.append(note);
   const fuel=build?.getPlantFuel?.(p.id);if(fuel){
    const box=document.createElement('div');box.className='individualFuel';box.style.cssText='margin-top:12px;padding:10px;border:1px solid #42666a;border-radius:9px;background:#102a33';
    const label=document.createElement('div');label.style.cssText='font-size:12px;line-height:1.6';
    const qty=document.createElement('input');qty.type='number';qty.min='1';qty.step='1';qty.value=String(fuel.batch);qty.style.cssText='width:100%;margin:6px 0;padding:7px;border-radius:6px;background:#10232b;color:#fff;border:1px solid #547b80';
    const buy=document.createElement('button');buy.style.cssText='width:100%;padding:8px;background:#246854;color:white;border:1px solid #5ac9a1;border-radius:7px;cursor:pointer';
    const upgrade=document.createElement('button');upgrade.style.cssText='width:100%;padding:8px;margin-top:6px;background:#23414c;color:white;border:1px solid #5a7c84;border-radius:7px;cursor:pointer';
    function refresh(){const f=build?.getPlantFuel?.(p.id);if(!f)return;label.textContent='⛽ '+f.name+': '+f.stock.toLocaleString('sk-SK',{maximumFractionDigits:2})+' / '+f.capacity.toLocaleString('sk-SK')+' '+f.unit+' · '+f.price.toLocaleString('sk-SK')+' €/'+f.unit+' · spotreba '+((p.actualMW||0)*f.perMWh).toFixed(2)+' '+f.unit+'/h';buy.textContent='Kúpiť palivo · '+(Math.max(0,Math.floor(+qty.value||0))*f.price).toLocaleString('sk-SK')+' €';upgrade.textContent='⬆ Rozšíriť sklad (+50 %) · '+f.upgradeCost.toLocaleString('sk-SK')+' € · úroveň '+(f.level+1);}
    qty.oninput=refresh;buy.onclick=()=>{const result=build.buyPlantFuel(p.id,+qty.value);showToast(result.message);refresh()};upgrade.onclick=()=>{const result=build.upgradePlantFuel(p.id);showToast(result.message);refresh()};
    label.dataset.fuelId=p.id;box.append(label,qty,buy,upgrade);card.append(box);refresh();
   }
  }
  holder.append(card);
 }
}
function updateFuelInfo(){const eng=engine(),st=eng?.getState(),fuels=eng?.getFuelConfig?.()||{};if(!st)return;for(const [k,f] of Object.entries(fuels)){const el=$ui('fuelinfo-'+k);if(!el)continue;const q=st.fuel?.[k]||0;const mw=Number(sim.contentWindow.document.getElementById(k+'A')?.textContent)||0;const hours=mw>0?q/(mw*f.perMWh):0;const upgrade=eng.getFuelUpgradeInfo?.(k);const cap=upgrade?.capacity??f.capacity;const upgradeButton=$ui('upgrade-'+k);if(upgradeButton&&upgrade){upgradeButton.textContent='⬆ Rozšíriť sklad +'+upgrade.increase.toLocaleString('sk-SK')+' '+f.unit+' · '+upgrade.price.toLocaleString('sk-SK')+' € (úroveň '+(upgrade.level+1)+')';upgradeButton.disabled=st.money<upgrade.price||st.over;}el.textContent='Sklad: '+q.toLocaleString('sk-SK',{maximumFractionDigits:1})+' / '+cap.toLocaleString('sk-SK')+' '+f.unit+' ('+Math.round(q/cap*100)+' %) · Cena: '+f.price.toLocaleString('sk-SK')+' €/'+f.unit+' · Spotreba: '+(mw*f.perMWh).toFixed(2)+' '+f.unit+'/h · Zásoba na '+(mw?hours.toFixed(1)+' h':'—')+' · Výkon: '+mw+' MW';}}

function updateDashboard(){const st=engine()?.getState(),frame=sim.contentWindow;if(!st)return;renderPlants();updateFuelInfo();syncPauseButton();const d=new Date(2026,10,6,Math.floor(st.t||0)),hour=((Math.floor(st.t||0)%24)+24)%24;const date=d.toLocaleDateString('sk-SK',{day:'numeric',month:'long',year:'numeric'});$ui('uiDate').textContent=date;updateTopClock(st.t||0);updateWeatherUI(st);updateTopIndicators(st);$ui('uiMoney').textContent=(st.money/1e6).toFixed(2).replace('.',',')+' M€';const today=st.money-st.dayStart;const monthStart=new Date(d.getFullYear(),d.getMonth(),1);const hoursFromMonth=Math.max(1,(d-monthStart)/3600000);const monthly=st.days?.slice(-Math.min(30,Math.ceil(hoursFromMonth/24)))?.reduce((a,b)=>a+b,0)||0;const fields=[['Dátum',date],['Herný čas',String(hour).padStart(2,'0')+':00'],['Bankový účet',euro(st.money)],['Príjem dnes',euro(today)],['Výsledok včera',st.last==null?'—':euro(st.last)],['Výsledok tento mesiac (orientačný)',euro(monthly+today)],['Celkový zisk / strata',euro(st.money-(engine()?.getStartMoney()||5000000))],['Emisie CO₂',Math.round(st.em||0).toLocaleString('sk-SK')+' t'],['Spokojnosť',Math.round(st.sat||0)+' %'],['Vyrobená / dodaná energia',((st.served||0)).toFixed(1)+' GWh'],['Znečistenie ovzdušia',Math.round(st.air||0)+' t/h']];const details=$ui('details');details.replaceChildren();for(const [label,value] of fields){const row=document.createElement('div');row.className='detailRow';const a=document.createElement('span'),b=document.createElement('strong');a.textContent=label;b.textContent=value;row.append(a,b);details.append(row)}for(const p of engine()?.getPlants()||[]){const output=$ui('out-'+p.k),percent=$ui('pct-'+p.k);if(output)output.textContent=frame.document.getElementById(p.k+'A')?.textContent+' MW';if(percent)percent.textContent=frame.document.getElementById(p.k)?.value+' %'}}
setInterval(updateDashboard,700);
world.addEventListener('load',()=>{world.contentWindow.addEventListener('powerplant:buildNotice',e=>showToast(e.detail.message));world.contentWindow.addEventListener('powerplant:constructionChanged',e=>{engine()?.setMoney(e.detail.money);showToast('Stavba bola pridaná na mapu.')});world.contentWindow.addEventListener('powerplant:worldGenerated',()=>{$ui('cancelBuild').click()})});


const daylight={rise:[7.3,6.8,6,5.8,5,4.6,4.8,5.4,6,6.6,6.5,7.2],set:[16.2,17.2,18,19.6,20.5,21.2,21,20.2,19,17.7,16.3,15.8]};
const dialPoint=(h,r)=>{const a=h/24*Math.PI*2-Math.PI/2;return [50+r*Math.cos(a),50+r*Math.sin(a)]};
function dialArc(a,b,r){const p=dialPoint(a,r),q=dialPoint(b,r);return `M ${p[0]} ${p[1]} A ${r} ${r} 0 ${b-a>12?1:0} 1 ${q[0]} ${q[1]}`}
function dialWedge(a,b){const p=dialPoint(a,45),q=dialPoint(b,45);return `M50 50 L${p[0]} ${p[1]} A45 45 0 ${b-a>12?1:0} 1 ${q[0]} ${q[1]} Z`}
for(let i=0;i<24;i++){const a=dialPoint(i,37),b=dialPoint(i,i%6===0?44:41);const line=document.createElementNS('http://www.w3.org/2000/svg','line');line.setAttribute('x1',a[0]);line.setAttribute('y1',a[1]);line.setAttribute('x2',b[0]);line.setAttribute('y2',b[1]);$ui('clockTicks').append(line)}
let lastClockMonth=-1,clockVisual=0,clockTarget=0,clockLastFrame=performance.now();
function updateTopClock(t){clockTarget=t;const d=new Date(2026,10,6,Math.floor(t)),mon=d.getMonth();if(mon!==lastClockMonth){lastClockMonth=mon;const a=daylight.rise[mon],b=daylight.set[mon];$ui('clockDay').setAttribute('d',dialWedge(a,b));$ui('clockNight').setAttribute('d',dialWedge(b,a+24));$ui('clockDayRim').setAttribute('d',dialArc(a,b,46));$ui('clockNightRim').setAttribute('d',dialArc(b,a+24,46))}const h=((t%24)+24)%24;}
function animateClock(now){
 const dt=Math.min(.1,(now-clockLastFrame)/1000);clockLastFrame=now;
 const paused=engine()?.isPaused()===true;
 // Po pauze sa ručička zastaví okamžite, bez dobiehania animácie.
 if(paused){clockVisual=clockTarget}
 else if(clockTarget<clockVisual-1){clockVisual=clockTarget}
 else {const rate=Math.max(.1,engine()?.getSpeed?.()||1)*2.2;clockVisual+=Math.min(Math.max(0,clockTarget-clockVisual),dt*rate)}
 $ui('clockHand').setAttribute('transform',`rotate(${clockVisual*15} 50 50)`);
 requestAnimationFrame(animateClock)
}requestAnimationFrame(animateClock);
function syncPauseButton(){const paused=engine()?.isPaused()||false;const btn=$ui('pauseClock');btn.textContent=paused?'▶':'⏸';btn.title=paused?'Pokračovať v simulácii':'Pozastaviť simuláciu';btn.setAttribute('aria-pressed',String(paused))}
$ui('pauseClock').addEventListener('click',()=>{const simEngine=engine();if(!simEngine)return;simEngine.togglePause();syncPauseButton()});
$ui('customSpeed').addEventListener('change',e=>{
 const parsed=Number(String(e.target.value).replace(',','.'));
 const value=Math.max(.1,Math.min(100,Number.isFinite(parsed)&&parsed>0?parsed:1));
 e.target.value=String(value);engine()?.setSpeed(value)
});
sim.addEventListener('load',()=>{engine()?.setSpeed(Number($ui('customSpeed').value)||1);syncPauseButton()});
function updateTopIndicators(st){
 const sat=Math.max(0,Math.min(100,st.sat??0)),b=st.satBreakdown||{},direction=(b.delta||0)>0.005?'rastie':(b.delta||0)<-0.005?'klesá':'je stabilná';
 const fmt=n=>Number(n||0).toFixed(2).replace('.',',');
 const tips=b.cityAverage?`Priemerná spokojnosť všetkých vlastnených miest: ${fmt(sat)} %.\nNezávisí od nej výpočet peňazí.`:`SPOKOJNOSŤ: ${fmt(sat)} % — ${direction} (${b.delta>=0?'+':''}${fmt(b.delta)} bodu/h)\nCieľová spokojnosť: ${fmt(b.target??100)} %\nZnečistenie ovzdušia: −${fmt(b.pollution)} bodu\nVýpadky: −${fmt(b.blackout)} bodu\nNedostatok dodávky: −${fmt(b.shortfall)} bodu\nAktuálne znečistenie: ${fmt(b.air)} t/h\nSpokojnosť sa postupne približuje k cieľovej hodnote.`;
 $ui('topSatValue').textContent=Math.round(sat)+' %';$ui('topSatBar').style.width=sat+'%';$ui('topSatBar').style.background=sat<35?'#ee6565':sat<65?'#e5b348':'#39bc7a';$ui('topSatBar').parentElement.parentElement.title=tips;
 const em=Math.round(st.em||0),e=st.emBreakdown||{},names={nu:'Jadrová',so:'Solárna',hy:'Vodná',wi:'Veterná',cl:'Uhoľná',ga:'Plynová',oi:'Ropná',backup:'Záložná výroba (vypnutá)'};
 const lines=Object.entries(names).map(([k,name])=>`${name}: ${fmt(e[k])} t CO₂/h`);
 $ui('topEmValue').textContent=em.toLocaleString('sk-SK')+' t';
 $ui('topEmissions').title=`EMISIE CO₂: ${em.toLocaleString('sk-SK')} t celkom\nAktuálny prírastok: +${fmt(st.emRate)} t/h\n\nPríspevky podľa zdrojov:\n${lines.join('\n')}\n\nEmisie sú kumulatívne, preto neklesajú; znížiť možno rýchlosť ich pribúdania. Model zahŕňa životný cyklus zdrojov.`;
 const detail=$ui('details');if(detail){const rows=detail.querySelectorAll('.detailRow');for(const row of rows){const name=row.querySelector('span')?.textContent||'';if(name.includes('Spokojnosť'))row.title=tips;if(name.includes('Emisie'))row.title=$ui('topEmissions').title;}}
}
function updateWeatherUI(st){const w=engine()?.getWeather(),banner=$ui('weatherBanner');banner.hidden=!w;if(!w)return;$ui('weatherTitle').textContent=w.icon+' '+w.name+' · '+Math.max(0,Math.ceil((w.until-st.t)/24))+' dní';$ui('weatherDesc').textContent=w.desc+' · Hydro '+Math.round((w.hy-1)*100)+' %, solár '+Math.round((w.so-1)*100)+' %, vietor '+Math.round((w.wi-1)*100)+' %, odber '+Math.round((w.dm-1)*100)+' %';banner.title='Environmentálna udalosť — každých 7 herných dní. '+w.desc}
function syncNavHeight(){document.documentElement.style.setProperty('--nav-height',document.querySelector('.nav').getBoundingClientRect().height+'px')}
new ResizeObserver(syncNavHeight).observe(document.querySelector('.nav'));syncNavHeight();
window.PowerplantBridge.onGameOver=({win,reason,hours,money,emissions,served})=>{
 if(win)return;
 const overlay=document.getElementById('bankruptcyOverlay');
 document.getElementById('bankruptcyReason').textContent=reason||'Tvoja energetická spoločnosť skrachovala.';
 document.getElementById('bankruptcyStats').textContent='Prežité: '+Math.floor(hours/24)+' dní · Zostatok: '+Math.round(money).toLocaleString('sk-SK')+' € · Dodané: '+Number(served).toFixed(1)+' GWh';
 overlay.classList.add('visible');
};
document.getElementById('bankruptcyRestart').addEventListener('click',()=>location.reload());
window.PowerplantBridge.isCoastal=()=>{const api=map(),st=api?.getState();if(!st?.startCity)return false;const c=st.cities.find(x=>x.id===st.startCity);if(!c)return false;for(let r of [150,300,500])for(let j=0;j<16;j++){const a=j*Math.PI/8,t=api.getTerrain(c.x+r*Math.cos(a),c.y+r*Math.sin(a));if(t&&t.e<=.43)return true}return false};
