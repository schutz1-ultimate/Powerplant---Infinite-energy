SRC.forEach(([k,,col])=&gt;{const mw=k==='ps'?p:O[k];f('ln_'+k,mw,cl(col),k==='ps'&amp;&amp;p&lt;0);$('tx_'+k).textContent=(k==='ps'&amp;&amp;p&gt;0?'+':'')+Math.round(mw)+' MW'});
const col=h=&gt;h&gt;=100?c('--bad'):h&gt;50?c('--so'):c('--ok'),L=S.L;
const node=(id,off,color)=&gt;{$(id).style.stroke=off?c('--bad'):color;$(id).style.fill=off?'var(--bd)':'var(--card)'};
node('nA',G.cut.A,col(L.f.h));node('nB',G.cut.B,G.sB&lt;G.nB-5?c('--so'):col(L.b.h));
f('lB',G.fb,G.cut.B?c('--bad'):col(L.b.h),false,1000);
$('tA').textContent=G.cut.A?'výpadok':Math.round(G.sA)+' / '+Math.round(G.d.A)+' MW';
$('tB').textContent=G.cut.B?'výpadok':Math.round(G.sB)+' / '+Math.round(G.d.B)+' MW';
$('tL').textContent='vedenie '+Math.round(L.b.h)+' %';
$('tF').textContent='prívod '+Math.round(L.f.h)+' %';$('tF').style.fill=col(L.f.h)}
function draw(){const c=$('cv'),x=c.getContext('2d'),W=c.width,H=c.height,cs=getComputedStyle(document.documentElement);
x.clearRect(0,0,W,H);const mx=3000;
x.strokeStyle=cs.getPropertyValue('--bd');x.fillStyle=cs.getPropertyValue('--mu');x.font='11px sans-serif';
for(let v=0;v&lt;=mx;v+=600){const y=H-v/mx*H;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();x.fillText(v+' MW',4,y-2)}
const line=(k,col,w)=&gt;{x.beginPath();x.strokeStyle=cs.getPropertyValue(col);x.lineWidth=w;S.hist.forEach((q,i)=&gt;{const px=i/95*W,py=H-Math.max(0,q[k])/mx*H;i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()};
line('s','--so',1.5);line('d','--dem',2);line('n','--ps',2.5)}
document.querySelectorAll('[data-s]').forEach(b=&gt;b.onclick=()=&gt;{speed=+b.dataset.s;document.querySelectorAll('[data-s]').forEach(o=&gt;o.classList.toggle('on',o===b));run()});
$('p').onclick=()=&gt;{paused=!paused;$('p').textContent=paused?'Pokračovať':'Pauza';clockFrom=clockTo;clockStarted=performance.now()};
window.PowerplantSimulation={getPlants:()=&gt;PL,getStartMoney:()=&gt;START,getState:()=&gt;S,setMoney:value=&gt;{if(S)S.money=Number(value)},pause:()=&gt;{if(!paused)document.getElementById('p').click()}};

" title="Energetická simulácia"></iframe><aside class="drawer left closed" id="leftDrawer"><div class="drawerHead"><strong>⚡ Moje elektrárne</strong><button id="closeLeft">✕</button></div><div id="ownedPlants"></div><div class="mutedUi">Výkon sa ovláda priamo v simulácii. Postavené objekty z mapy zatiaľ nie sú pripojené k výrobnej bilancii.</div></aside><aside class="drawer right closed" id="rightDrawer"><div class="drawerHead"><strong>📊 Prehľad siete</strong><button id="closeRight">✕</button></div><div id="details"></div></aside><div aria-live="polite" id="toast"></div><section hidden="" id="buildPalette"><div class="paletteHead"><strong id="paletteTitle">Stavba</strong><button id="closePalette">✕</button></div><div id="paletteItems"></div></section><footer id="buildBar"><button data-category="plants">🏭<span>Elektrárne</span></button><button data-category="storage">🔋<span>Úložiská</span></button><button data-category="cables">〰<span>Káble</span></button><button data-category="switches">⬡<span>Rozvádzače</span></button><div class="buildStatus" id="buildStatus">Vyber kategóriu stavania</div><button id="cancelBuild">✕ Zrušiť</button></footer></div>
<script>
const world=document.getElementById('world'),sim=document.getElementById('sim'),status=document.getElementById('bridgeStatus');
const map=()=>world.contentWindow?.PowerplantMap,engine=()=>sim.contentWindow?.PowerplantSimulation;
function tab(which){}

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
window.PowerplantBridge={
 getOwnedDemand(hour){const api=map(),st=api?.getState();if(!st?.startCity)return null;return st.cities.filter(c=>c.unlocked).reduce((sum,c)=>sum+api.getDemand(c.id,hour),0)},
 onTick(data){const api=map(),st=api?.getState();if(!st)return;
  api.setTime(data.hour);api.setMoney(data.money);
  const owned=st.cities.filter(c=>c.unlocked),total=owned.reduce((a,c)=>a+api.getDemand(c.id,data.hour),0);
  // Provisional allocation: no actual transmission topology yet. Only owned cities receive supply.
  const ratio=total>0?clamp(data.served/total,0,1):0;
  for(const c of owned){const need=api.getDemand(c.id,data.hour);api.setCitySupply(c.id,need*ratio);const target=clamp(100-(1-ratio)*85,0,100);api.setCitySatisfaction(c.id,c.satisfaction+(target-c.satisfaction)*.06)}
  api.redraw();status.textContent=owned.length+' miest · '+Math.round(data.net)+' MW výroba · '+Math.round(data.served)+' MW dodávka · '+(data.money/1e6).toFixed(2)+' M€';
 }
};
world.addEventListener('load',()=>{const w=world.contentWindow;
 w.addEventListener('powerplant:cityUnlocked',()=>{const state=map()?.getState();if(state&&engine()?.getState())engine().setMoney(state.money)});
 w.addEventListener('powerplant:switchboardChanged',()=>{const state=map()?.getState();if(state&&engine()?.getState())engine().setMoney(state.money)});
 w.addEventListener('powerplant:worldGenerated',()=>{const state=map()?.getState();if(state&&engine()?.getState()){state.money=engine().getState().money}status.textContent='Vyber si prvé mesto na mape';tab('Map')});
});

const $ui=id=>document.getElementById(id),euro=n=>new Intl.NumberFormat('sk-SK',{maximumFractionDigits:0}).format(Math.round(n||0))+' €';
let selectedCategory=null,selectedBuild=null;
const categories={plants:['nu','so','hy','wi','cl','ga','oi'],storage:['battery','pumped'],cables:['cable'],switches:['switch11','switch12','switch13','switch23']};
function showToast(message){const el=$ui('toast');el.textContent=message;el.style.display='block';clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>el.style.display='none',2800)}
function openPalette(cat){selectedCategory=cat;$ui('buildPalette').hidden=false;$ui('paletteTitle').textContent={plants:'🏭 Stavba elektrární',storage:'🔋 Úložiská energie',cables:'〰 Elektrické vedenia',switches:'⬡ Rozvádzače'}[cat];document.querySelectorAll('[data-category]').forEach(b=>b.classList.toggle('selected',b.dataset.category===cat));const catalog=world.contentWindow?.PowerplantConstruction?.catalog||{};$ui('paletteItems').innerHTML='';for(const type of categories[cat]){const info=catalog[type];if(!info)continue;const b=document.createElement('button');b.className='catalogItem'+(selectedBuild===type?' selected':'');const title=document.createElement('b');title.textContent=info.icon+' '+info.label;const price=document.createElement('small');price.textContent=type==='cable'?'Cena podľa dĺžky':euro(info.cost);b.append(title,price);b.onclick=()=>{selectedBuild=type;world.contentWindow.PowerplantConstruction.setTool(type);$ui('buildStatus').textContent=info.label+' — klikni na mapu';showToast(type==='cable'?'Klikni na dva objekty, ktoré chceš prepojiť.':'Klikni na suchú pevninu, kde chceš stavať.');openPalette(cat)};$ui('paletteItems').append(b)}}
document.querySelectorAll('[data-category]').forEach(b=>b.onclick=()=>openPalette(b.dataset.category));
$ui('closePalette').onclick=()=>{$ui('buildPalette').hidden=true;document.querySelectorAll('[data-category]').forEach(b=>b.classList.remove('selected'))};
$ui('cancelBuild').onclick=()=>{selectedBuild=null;selectedCategory=null;world.contentWindow?.PowerplantConstruction?.setTool(null);$ui('buildPalette').hidden=true;$ui('buildStatus').textContent='Vyber kategóriu stavania';document.querySelectorAll('[data-category]').forEach(b=>b.classList.remove('selected'))};
function toggleDrawer(id,force){const el=$ui(id);el.classList.toggle('closed',force===undefined?!el.classList.contains('closed'):!force)}
$ui('toggleLeft').onclick=()=>toggleDrawer('leftDrawer');$ui('toggleRight').onclick=()=>toggleDrawer('rightDrawer');$ui('closeLeft').onclick=()=>toggleDrawer('leftDrawer',false);$ui('closeRight').onclick=()=>toggleDrawer('rightDrawer',false);
function renderPlants(){const frame=sim.contentWindow,eng=engine(),holder=$ui('ownedPlants');if(!eng?.getPlants()||!eng?.getState())return;const plants=eng.getPlants();if(holder.children.length===plants.length)return;holder.innerHTML='';for(const p of plants){const card=document.createElement('div');card.className='plantCard';const title=document.createElement('div');title.className='plantTitle';title.textContent=p.i+' '+p.n;const meta=document.createElement('div');meta.className='plantMeta';const output=document.createElement('span');output.id='out-'+p.k;const percent=document.createElement('span');percent.id='pct-'+p.k;meta.append(output,percent);const slider=document.createElement('input');slider.type='range';slider.min=p.k==='nu'?50:0;slider.max=100;slider.value=frame.document.getElementById(p.k)?.value||0;slider.dataset.plant=p.k;slider.oninput=()=>{const source=frame.document.getElementById(p.k);if(source)source.value=slider.value;percent.textContent=slider.value+' %'};const note=document.createElement('small');note.textContent='Nastavenie cieľového výkonu';card.append(title,meta,slider,note);holder.append(card)}}
function updateDashboard(){const st=engine()?.getState(),frame=sim.contentWindow;if(!st)return;renderPlants();const d=new Date(2026,10,6,Math.floor(st.t||0)),hour=((Math.floor(st.t||0)%24)+24)%24;const date=d.toLocaleDateString('sk-SK',{day:'numeric',month:'long',year:'numeric'});$ui('uiDate').textContent=date;$ui('uiClock').textContent=String(hour).padStart(2,'0')+':00';$ui('uiMoney').textContent=(st.money/1e6).toFixed(2).replace('.',',')+' M€';const today=st.money-st.dayStart;const monthStart=new Date(d.getFullYear(),d.getMonth(),1);const hoursFromMonth=Math.max(1,(d-monthStart)/3600000);const monthly=st.days?.slice(-Math.min(30,Math.ceil(hoursFromMonth/24)))?.reduce((a,b)=>a+b,0)||0;const fields=[['Dátum',date],['Herný čas',String(hour).padStart(2,'0')+':00'],['Bankový účet',euro(st.money)],['Príjem dnes',euro(today)],['Výsledok včera',st.last==null?'—':euro(st.last)],['Výsledok tento mesiac (orientačný)',euro(monthly+today)],['Celkový zisk / strata',euro(st.money-(engine()?.getStartMoney()||5000000))],['Emisie CO₂',Math.round(st.em||0).toLocaleString('sk-SK')+' t'],['Spokojnosť',Math.round(st.sat||0)+' %'],['Vyrobená / dodaná energia',((st.served||0)).toFixed(1)+' GWh'],['Znečistenie ovzdušia',Math.round(st.air||0)+' t/h']];const details=$ui('details');details.replaceChildren();for(const [label,value] of fields){const row=document.createElement('div');row.className='detailRow';const a=document.createElement('span'),b=document.createElement('strong');a.textContent=label;b.textContent=value;row.append(a,b);details.append(row)}for(const p of engine()?.getPlants()||[]){const output=$ui('out-'+p.k),percent=$ui('pct-'+p.k);if(output)output.textContent=frame.document.getElementById(p.k+'A')?.textContent+' MW';if(percent)percent.textContent=frame.document.getElementById(p.k)?.value+' %'}}
setInterval(updateDashboard,700);
world.addEventListener('load',()=>{world.contentWindow.addEventListener('powerplant:buildNotice',e=>showToast(e.detail.message));world.contentWindow.addEventListener('powerplant:constructionChanged',e=>{engine()?.setMoney(e.detail.money);showToast('Stavba bola pridaná na mapu.')});world.contentWindow.addEventListener('powerplant:worldGenerated',()=>{$ui('cancelBuild').click()})});
</script></body></html>
