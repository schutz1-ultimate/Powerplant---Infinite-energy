 }
 if(type.startsWith('cable')){

  if(isGenerator(node)){construction.cableFrom=null;construction.cableMouse=null;draw();notifyBuild('Elektrárne nemôžu prijímať elektrinu – majú iba výstupy!');return}
  if(from.type==='pumped'){construction.cableFrom=null;construction.cableMouse=null;draw();notifyBuild('💧 Výstup prečerpávacej nádrže môže viesť iba do vodnej elektrárne.');return}
  if(portFull(from,'output')){construction.cableFrom=null;construction.cableMouse=null;draw();notifyBuild(isSwitch(from)?'Príliš málo výstupov! Rozšír rozvádzač.':isGenerator(from)?'Elektráreň má obsadené oba výstupy.':'Zdroj má obsadené oba káblové sloty (2/2).');return}
  if(portFull(node,'input')){construction.cableFrom=null;construction.cableMouse=null;draw();notifyBuild(isSwitch(node)?'Príliš málo vstupov! Rozšír rozvádzač.':'Cieľ má obsadené oba káblové sloty (2/2).');return}
  if(construction.links.some(l=&gt;(l.a===from.id&amp;&amp;l.b===node.id)||(l.a===node.id&amp;&amp;l.b===from.id))){construction.cableFrom=null;construction.cableMouse=null;draw();notifyBuild('Tieto objekty sú už prepojené. Začni nové spojenie od objektu 1.');return}

  const samples=Math.max(12,Math.ceil(length/16));
  let mountainLength=0,roughLength=0,waterLength=0,riverCrossings=0,prevRiver=false;
  for(let i=0;i&lt;=samples;i++){
   const f=i/samples,x=from.x+(node.x-from.x)*f,y=from.y+(node.y-from.y)*f;

 if(type==='hy'){

function buildClick(e){if(construction.suppressClick){construction.suppressClick=false;e.stopImmediatePropagation();e.preventDefault();return}if(!construction.tool||!state?.startCity)return;const r=canvas.getBoundingClientRect(),pt=world(e.clientX-r.left,e.clientY-r.top),type=construction.tool,info=buildCatalog[type];if(!info)return;e.stopImmediatePropagation();e.preventDefault();
 // Prečerpávacie úložisko sa musí bezprostredne po výbere miesta pripojiť k vode.
 if(construction.pumpPending){
  if(type!=='pumped'){notify('buildNotice',{message:'Najprv pripoj prečerpávacie úložisko k vode, alebo stlač Esc.'});return}
  if(!isWater(pt.x,pt.y)){notify('buildNotice',{message:'Druhý bod musí byť vo vode: more, jazero alebo rieka. Klikni na vodu.'});return}
  const site=construction.pumpPending;
  if(state.money&lt;info.cost){notify('buildNotice',{message:'Nemáš dosť peňazí na úložisko.'});return}
  state.money-=info.cost;
  construction.items.push({id:'built-'+(construction.items.length+1),type:'pumped',name:info.label,x:site.x,y:site.y,waterX:pt.x,waterY:pt.y,waterConnected:true,inputs:1,outputs:1,heat:0,failed:false,stored:0,maxStored:12000,storageLevel:0});
  construction.pumpPending=null;construction.pumpMouse=null;
  notify('constructionChanged',{money:state.money,items:construction.items,links:construction.links});
  notify('buildNotice',{message:'💦 Úložisko je postavené a napojené na vodu. Teraz ho môžeš pripojiť káblom.'});draw();return;
 }
 if(type.startsWith('cable')){
  const node=construction.forcedJunction||buildNearest(pt);
  if(!node){construction.cableFrom=null;construction.cableMouse=null;draw();construction.cableMouse=null;draw();notifyBuild('Neplatné spojenie. Začni znova: klikni na objekt 1 a potom na objekt 2.');return}
  if(!construction.cableFrom){
   if(node.type==='pumped'){notifyBuild('💧 Vodné potrubie vytvor tlačidlom Vypustiť v detaile nádrže.');return}
   if(portFull(node,'output')){notifyBuild(isSwitch(node)?'Príliš málo výstupov! Rozšír rozvádzač.':isGenerator(node)?'Elektráreň už má obsadené oba výstupné sloty.':'Objekt má obsadené oba káblové sloty (2/2).');return}
   construction.cableFrom=node.id;construction.cableMouse={x:e.clientX-r.left,y:e.clientY-r.top};draw();notifyBuild('Vyber cieľ vedenia.');return
  }
  if(construction.cableFrom===node.id){construction.cableFrom=null;construction.cableMouse=null;draw();notifyBuild('Spojenie zrušené. Vyber znovu objekt 1 a potom objekt 2.');return}
  const from=buildEndpoint(construction.cableFrom);
  if(!from){construction.cableFrom=null;construction.cableMouse=null;draw();notifyBuild('Pôvodný objekt už neexistuje.');return}
  if(isGenerator(node)){construction.cableFrom=null;construction.cableMouse=null;draw();notifyBuild('Elektrárne nemôžu prijímať elektrinu – majú iba výstupy!');return}
  if(from.type==='pumped'){construction.cableFrom=null;construction.cableMouse=null;draw();notifyBuild('💧 Výstup prečerpávacej nádrže môže viesť iba do vodnej elektrárne.');return}
  if(portFull(from,'output')){construction.cableFrom=null;construction.cableMouse=null;draw();notifyBuild(isSwitch(from)?'Príliš málo výstupov! Rozšír rozvádzač.':isGenerator(from)?'Elektráreň má obsadené oba výstupy.':'Zdroj má obsadené oba káblové sloty (2/2).');return}
  if(portFull(node,'input')){construction.cableFrom=null;construction.cableMouse=null;draw();notifyBuild(isSwitch(node)?'Príliš málo vstupov! Rozšír rozvádzač.':'Cieľ má obsadené oba káblové sloty (2/2).');return}
  if(construction.links.some(l=&gt;(l.a===from.id&amp;&amp;l.b===node.id)||(l.a===node.id&amp;&amp;l.b===from.id))){construction.cableFrom=null;construction.cableMouse=null;draw();notifyBuild('Tieto objekty sú už prepojené. Začni nové spojenie od objektu 1.');return}
  const length=Math.hypot(from.x-node.x,from.y-node.y);
  // Cena zahŕňa skutočnú dĺžku trasy a príplatky za horské úseky a prechody riek.
  // Vyššie triedy káblov majú výrazne nákladnejšie horské vedenie.
  const samples=Math.max(12,Math.ceil(length/16));
  let mountainLength=0,roughLength=0,waterLength=0,riverCrossings=0,prevRiver=false;
  for(let i=0;i&lt;=samples;i++){
   const f=i/samples,x=from.x+(node.x-from.x)*f,y=from.y+(node.y-from.y)*f;
   const elevation=terrain(x,y).e;
   if(i){if(elevation&gt;.78)mountainLength+=length/samples;else if(elevation&gt;.70)roughLength+=length/samples;else if(isWater(x,y))waterLength+=length/samples;}
   const onRiver=nearRiver(x,y,7);
   if(onRiver&amp;&amp;!prevRiver)riverCrossings++;
   prevRiver=onRiver;
  }
  const tier=Math.max(1,info.capacity/100);
  const price=Math.round(info.cost+length*35*tier+roughLength*150*tier*tier+mountainLength*480*tier*tier+waterLength*90*tier*tier+riverCrossings*1800*tier);
  if(state.money&lt;price){construction.cableFrom=null;construction.cableMouse=null;draw();notifyBuild('Nemáš dosť peňazí na vedenie.');return}
  const fromSlot=freePortIndex(from,'output'),toSlot=freePortIndex(node,'input');
  if(fromSlot&lt;0||toSlot&lt;0){construction.cableFrom=null;construction.cableMouse=null;draw();notifyBuild('Príliš málo voľných vstupov alebo výstupov.');return}
  state.money-=price;
  if(construction.forcedJunction){construction.items.push(construction.forcedJunction);construction.forcedJunction=null;}
  construction.links.push({a:from.id,b:node.id,fromSlot,toSlot,cost:price,capacity:info.capacity,flow:0,heat:0,broken:false,water:false});
  construction.cableFrom=null;construction.cableMouse=null;draw();notify('constructionChanged',{money:state.money,links:construction.links,items:construction.items});
  notifyBuild('Kábel pripojený. Cena '+price.toLocaleString('sk-SK')+' €.');draw();return
 }

 if(type==='hy'){
  if(!land(pt.x,pt.y)||isLake(pt.x,pt.y,0)||!nearRiver(pt.x,pt.y,14)){notify('buildNotice',{message:'Vodnú elektráreň môžeš postaviť iba priamo na rieke.'});return}
 }else if(!land(pt.x,pt.y)||isLake(pt.x,pt.y,0)||nearRiver(pt.x,pt.y,2)){notify('buildNotice',{message:'Tento bod je vo vode. Klikni na pevninu mimo vody.'});return}
 if(PLANT_CAP[type]&amp;&amp;terrain(pt.x,pt.y).e&gt;=.72){notify('buildNotice',{message:'Na horách nie je možné stavať elektrárne.'});return}
 // Kolízia iba pri skutočnom dotyku značiek na obrazovke, nie podľa veľkého pevného okruhu vo svete.
 const cityMarkerRadius=0;
 const placedRadius=infrastructureHitRadius(type);
 const touchingCity=state.cities.some(c=&gt;Math.hypot(c.x-pt.x,c.y-pt.y)&lt;(c.kind==='large'?180:90)*Math.pow(Math.max(1000,c.pop||1000)/(c.kind==='large'?350000:35000),.19)*1.25+placedRadius/pan.zoom);
 const touchingBuilding=construction.items.some(c=&gt;Math.hypot(c.x-pt.x,c.y-pt.y)*pan.zoom&lt;placedRadius+infrastructureHitRadius(c.type));
 if(touchingCity||touchingBuilding){notify('buildNotice',{message:touchingCity?'Stavba sa dotýka mesta. Posuň ju o kúsok vedľa.':'Stavba sa dotýka inej stavby. Posuň ju o kúsok vedľa.'});return}
 if(state.money&lt;info.cost){notify('buildNotice',{message:'Nemáš dosť peňazí.'});return}
 if(type==='pumped'){
  construction.pumpPending={x:pt.x,y:pt.y};
  notify('buildNotice',{message:'💦 Teraz natiahni prívod k vode: klikni na more, jazero alebo rieku. Bez vody sa úložisko nepostaví. Esc = zrušiť.'});
  draw();return;
 }

 const isPlant=['nu','so','hy','wi','cl','ga','oi'].includes(type);
 const name=isPlant?info.label+' '+(construction.items.filter(i=&gt;i.type===type).length+1):null;
 state.money-=info.cost;construction.items.push({id:'built-'+(construction.items.length+1),type,name:isPlant?name.trim().slice(0,65):info.label,x:pt.x,y:pt.y,inputs:info.inputs||0,outputs:info.outputs||0,inputLimits:Array(info.inputs||0).fill(100),outputLimits:Array(info.outputs||0).fill(100),target:isPlant?0:undefined,heat:0,failed:false,stored:0,maxStored:type==='battery'?5000:12000,storageLevel:0});notify('constructionChanged',{money:state.money,items:construction.items,links:construction.links});notify('buildNotice',{message:(isPlant?name.trim():info.label)+' postavený za '+info.cost.toLocaleString('sk-SK')+' €.'});draw();}

// Vlastne herne potvrdzovacie okno namiesto prehliadacoveho confirm().
function openGameConfirm(title,message,onYes,onNo){
 const overlay=document.getElementById('ppGameConfirm');
 const heading=document.getElementById('ppGameConfirmTitle');
 const content=document.getElementById('ppGameConfirmText');
 const yes=document.getElementById('ppGameConfirmYes');
 const no=document.getElementById('ppGameConfirmNo');
 heading.textContent=title;content.textContent=message;overlay.hidden=false;
 let finished=false;
 const finish=(accept)=&gt;{if(finished)return;finished=true;overlay.hidden=true;yes.onclick=null;no.onclick=null;document.removeEventListener('keydown',escape);if(accept){if(onYes)onYes()}else if(onNo)onNo()};
 const escape=e=&gt;{if(e.key==='Escape'){e.preventDefault();finish(false)}};
 yes.onclick=()=&gt;finish(true);no.onclick=()=&gt;finish(false);document.addEventListener('keydown',escape);
 no.focus();
}
// Rezim odstranovania: budovy a kable, nie mesta.
function pickPlaced(pt){let best=null,d=Infinity;for(const item of construction.items){const q=Math.hypot(item.x-pt.x,item.y-pt.y)*pan.zoom;if(q&lt;infrastructureHitRadius(item.type)&amp;&amp;q&lt;d){best=item;d=q}}return best}
function pointLineDistance(px,py,a,b){const vx=b.x-a.x,vy=b.y-a.y,t=clamp(((px-a.x)*vx+(py-a.y)*vy)/(vx*vx+vy*vy||1),0,1);return Math.hypot(px-a.x-vx*t,py-a.y-vy*t)}
function pickCable(pt){let best=null,d=Infinity;for(const link of construction.links){const a=buildEndpoint(link.a),b=buildEndpoint(link.b);if(!a||!b)continue;const q=pointLineDistance(pt.x,pt.y,a,b)*pan.zoom;if(q&lt;10&amp;&amp;q&lt;d){best=link;d=q}}return best}
function validRelocation(item,x,y){if(item.type==='hy'){if(!land(x,y)||isLake(x,y,0)||!nearRiver(x,y,14))return 'Vodná elektráreň musí zostať na rieke.';}else if(!land(x,y)||isLake(x,y,0)||nearRiver(x,y,2))return 'Objekt musí zostať na suchej pevnine.';if(PLANT_CAP[item.type]&amp;&amp;terrain(x,y).e&gt;=.72)return 'Elektrárne sa nedajú umiestniť na hory.';if(state.cities.some(c=&gt;Math.hypot(c.x-x,c.y-y)&lt;(c.kind==='large'?180:90)*Math.pow(Math.max(1000,c.pop||1000)/(c.kind==='large'?350000:35000),.19)*1.25))return 'Nové miesto sa prekrýva s mestom.';if(construction.items.some(i=&gt;i!==item&amp;&amp;Math.hypot(i.x-x,i.y-y)*pan.zoom&lt;infrastructureHitRadius(item.type)+infrastructureHitRadius(i.type)))return 'Nové miesto sa prekrýva s iným objektom.';return null}

function fuelCapacity(k){return S?.fuelCapacity?.[k] ?? FUEL[k]?.capacity ?? 0;}
function fuelUpgradeInfo(k){const f=FUEL[k];if(!f||!S)return null;const level=S.fuelUpgrades?.[k]||0;const increase=Math.round(f.capacity*0.5);const price=Math.round(f.capacity*f.price*0.12*Math.pow(1.65,level));return {level,capacity:fuelCapacity(k),increase,price};}
function upgradeFuelStorage(k){const info=fuelUpgradeInfo(k);if(!info||S.over)return {ok:false,message:'Upgrade nie je dostupný.'};if(S.money&lt;info.price)return {ok:false,message:'Nedostatok peňazí na rozšírenie skladu ('+info.price.toLocaleString('sk-SK')+' €).'};S.money-=info.price;S.fuelCapacity[k]=info.capacity+info.increase;S.fuelUpgrades[k]=info.level+1;return {ok:true,message:'Sklad rozšírený na '+S.fuelCapacity[k].toLocaleString('sk-SK')+' '+FUEL[k].unit+'.'};}
function fuelBuy(k,amount){const f=FUEL[k];if(!f||!S||S.over)return {ok:false,message:'Nedostupné'};
 const q=Math.min(Math.max(0,Math.floor(Number(amount)||0)),Math.floor(fuelCapacity(k)-S.fuel[k]));const cost=Math.round(q*f.price);
 if(!q)return {ok:false,message:'Sklad je plný.'};if(S.money&lt;cost)return {ok:false,message:'Nedostatok peňazí ('+cost.toLocaleString('sk-SK')+' €).'};
 accountingFuelPurchase(S,cost,k,false);S.money-=cost;S.fuel[k]+=q;return {ok:true,message:'Nakúpené '+q.toLocaleString('sk-SK')+' '+f.unit+' za '+cost.toLocaleString('sk-SK')+' €.'};}
function fuelLimit(k,requested){const f=FUEL[k];if(!f)return requested;const actual=Math.max(0,Math.min(requested,S.fuel[k]/(f.perMWh*DT)));
 S.fuel[k]=Math.max(0,S.fuel[k]-actual*f.perMWh*DT);return actual;}

h+=`&lt;line id=&quot;ln_${k}&quot; x1=&quot;92&quot; y1=&quot;${y}&quot; x2=&quot;${ex.toFixed(1)}&quot; y2=&quot;${ey}&quot;/&gt;&lt;text x=&quot;18&quot; y=&quot;${y+8}&quot; font-size=&quot;22&quot; text-anchor=&quot;middle&quot;&gt;${ic}&lt;/text&gt;&lt;text id=&quot;tx_${k}&quot; x=&quot;86&quot; y=&quot;${y-5}&quot; font-size=&quot;11&quot; text-anchor=&quot;end&quot;&gt;&lt;/text&gt;`});

$('ckt').innerHTML=t})();
function demandBase(h){const g=(m,s)=&gt;Math.exp(-Math.pow((h-m)/s,2));return 900+250*g(8,2.4)+320*g(19,2.6)+80*g(13,2)}
const START=5e6;
// mesačné tabuľky (január..december): východ/západ slnka, špička FV, priemerná oblačnosť, sezónna spotreba, priemerná veľkoobchodná cena SK 2025 (€/MWh), dostupnosť vody, priemerný vietor
const SM={d0:[7.3,6.8,6,5.8,5,4.6,4.8,5.4,6,6.6,6.5,7.2],d1:[16.2,17.2,18,19.6,20.5,21.2,21,20.2,19,17.7,16.3,15.8],pk:[.28,.4,.55,.7,.78,.8,.8,.76,.66,.48,.4,.28],cl:[.35,.4,.48,.52,.56,.58,.6,.6,.54,.46,.42,.36],dm:[1.08,1.07,1.02,.96,.92,.9,.89,.9,.95,1,1.04,1.08],pm:[140,153,105,85,77,80,90,88,94,98,120,111],hy:[.7,.7,.9,1,1,.9,.75,.65,.6,.65,.7,.7],wi:[.42,.42,.38,.32,.26,.22,.2,.2,.26,.34,.4,.44]};

const WEATHER_EVENTS=[
 {id:'drought',icon:'🏜️',name:'Sucho',desc:'Menej vody v nádržiach, viac slnka a vyšší odber na chladenie.',days:4,hy:.65,so:1.20,wi:1,dm:1.04},
 {id:'rain',icon:'🌧️',name:'Výdatný dážď',desc:'Vodné elektrárne získajú viac vody, solárne panely menej svetla.',days:4,hy:1.30,so:.68,wi:1.04,dm:.99},
 {id:'wind',icon:'🌬️',name:'Silný vietor',desc:'Vyšší výkon vetra, ale obmedzenie turbín pri nebezpečných nárazoch a viac oblačnosti.',days:3,hy:1,so:.85,wi:1.32,dm:1.02},
 {id:'tornado',icon:'🌪️',name:'Tornádo',desc:'Extrémne nárazy vynútia odstavenie časti veterných turbín, po búrke pribudne voda.',days:2,hy:1.13,so:.76,wi:.56,dm:1.05},
 {id:'tsunami',icon:'🌊',name:'Tsunami na pobreží',coastal:true,desc:'Pobrežné poškodenie zvyšuje spotrebu a obmedzuje výrobu; zvýšené prietoky mierne pomáhajú vodným zdrojom.',days:2,hy:1.08,so:.80,wi:.72,dm:1.09},
 {id:'cold',icon:'🥶',name:'Veľká zima',desc:'Výraznejší odber na kúrenie, viac vetra a slabšie vodné prietoky.',days:6,hy:.83,so:.90,wi:1.18,dm:1.13},
 {id:'cloud',icon:'☁️',name:'Oblačno',desc:'Menej solárnej energie, mierne viac vetra a nižšia spotreba na chladenie.',days:3,hy:1.04,so:.58,wi:1.12,dm:.97},
 {id:'heat',icon:'🌡️',name:'Vlna horúčav',desc:'Veľmi dobré slnečné podmienky, slabšie vodné zdroje a vyšší odber klimatizácií.',days:4,hy:.80,so:1.24,wi:.93,dm:1.11},
 {id:'snow',icon:'❄️',name:'Snehová búrka',desc:'Sneh zakrýva panely, silnejší vietor pomáha turbínam a rastie dopyt.',days:3,hy:.94,so:.48,wi:1.20,dm:1.10},
 {id:'flood',icon:'🌊',name:'Povodeň',desc:'Viac vody pre hydroelektrárne, ale vysoká hladina vyžaduje obmedzenia a slnka je menej.',days:3,hy:1.17,so:.70,wi:1.06,dm:1.04},
 {id:'fog',icon:'🌫️',name:'Hustá hmla',desc:'Slabšie solárne podmienky, menej vetra a mierne nižšia spotreba.',days:3,hy:1.04,so:.64,wi:.86,dm:.98},
 {id:'clear',icon:'☀️',name:'Jasné počasie',desc:'Výborná solárna výroba, ale slabší vietor a menej vody v nádržiach.',days:4,hy:.91,so:1.30,wi:.77,dm:1.03},
 {id:'storm',icon:'⛈️',name:'Búrky',desc:'Viac vody a vetra, menej slnka; nárazy môžu obmedziť veterné turbíny.',days:3,hy:1.21,so:.61,wi:1.09,dm:1.05},
 {id:'dust',icon:'🏜️',name:'Prachová búrka',desc:'Prach znižuje výkon panelov, vietor pomáha turbínam a stúpa potreba filtrácie.',days:3,hy:.94,so:.59,wi:1.17,dm:1.03},
 {id:'ice',icon:'🧊',name:'Námraza',desc:'Namŕzanie obmedzuje veterné turbíny a solárne panely, chlad zvyšuje dopyt.',days:3,hy:.92,so:.78,wi:.61,dm:1.08},
 {id:'spring',icon:'🌱',name:'Jarné topenie snehu',desc:'Vodné elektrárne majú viac vody, ale oblačnosť uberá solárny výkon.',days:4,hy:1.29,so:.86,wi:.97,dm:.98}
];
const weatherNow=()=&gt;S?.weather&amp;&amp;S.t&lt;S.weather.until?S.weather:null;
function weatherStep(){
 const week=Math.floor(S.t/168);if(week&lt;1||week&lt;=S.weatherWeek)return;S.weatherWeek=week;
 const coastal=window.parent.PowerplantBridge?.isCoastal?.()===true;
 let options=WEATHER_EVENTS.filter(e=&gt;!e.coastal||coastal).filter(e=&gt;e.id!==S.lastWeatherId);
 // Tornádo a tsunami sú výrazne vzácnejšie než bežné počasie.
 const damage=S.environment?.damage||0;
 // Coastal climate hazards use the existing wave effect, without claiming CO2 causes tectonic tsunami.
 if(damage&gt;0&amp;&amp;coastal)options.push({id:'tsunami',icon:'🌊',name:'Búrková prílivová vlna',desc:'Poškodené prostredie zvyšuje riziko pobrežných záplav počas búrok.',days:2,hy:1.04,so:.72,wi:.65,dm:1.10,environmental:true});
 // Nové klimatické udalosti sa odomykajú až podľa trvalého poškodenia (0–100 %).
 // Bežné týždenné počasie zostáva dostupné aj bez poškodenia.
 const permanentEvents=[
  {min:.15,id:'dirtyfog',icon:'🌫️',name:'Pretrvávajúci atmosférický zákal',desc:'Dlhodobé poškodenie ovzdušia obmedzuje slnečné žiarenie.',days:4,hy:1,so:.62,wi:.96,dm:1.02},
  {min:.25,id:'acidrain',icon:'🧪',name:'Kyslý dážď',desc:'Zhoršená kvalita ovzdušia a dažďov spôsobuje ďalšie prevádzkové problémy.',days:3,hy:1.16,so:.64,wi:1.03,dm:1.05},
  {min:.4,id:'megadrought',icon:'🏜️',name:'Dlhodobé extrémne sucho',desc:'Klimatická záťaž obmedzuje vodné zdroje a zvyšuje odber na chladenie.',days:7,hy:.38,so:1.15,wi:.9,dm:1.20},
  {min:.5,id:'superheat',icon:'🔥',name:'Extrémna vlna horúčav',desc:'Prehrievanie zvyšuje spotrebu elektriny a znižuje účinnosť vodných zdrojov.',days:6,hy:.60,so:1.12,wi:.76,dm:1.25},
  {min:.65,id:'blacksky',icon:'🌑',name:'Tmavá obloha',desc:'Hustý atmosférický zákal výrazne obmedzuje solárnu výrobu.',days:5,hy:.91,so:.24,wi:.84,dm:1.09},
  {min:.75,id:'climatestorm',icon:'⛈️',name:'Extrémna klimatická búrka',desc:'Silné búrky a nestabilné počasie obmedzujú výrobu a zvyšujú odber.',days:4,hy:1.38,so:.30,wi:.43,dm:1.19},
  {min:.9,id:'collapse',icon:'☠️',name:'Ekologická kríza',desc:'Rozsiahle dlhodobé poškodenie ekosystémov dramaticky zhoršuje podmienky výroby.',days:7,hy:.42,so:.32,wi:.56,dm:1.32}
 ];
 options.push(...permanentEvents.filter(e=&gt;damage&gt;=e.min&amp;&amp;e.id!==S.lastWeatherId).map(e=&gt;({...e,environmental:true})));
 const weighted=options.map(e=&gt;({e,w:e.environmental?(e.min?1.1+damage*2.5:damage*2):e.id==='tornado'?.09+damage*1.8:e.id==='tsunami'?.045:['heat','drought','storm','flood','dust'].includes(e.id)?1+damage*1.5:1}));
 let roll=Math.random()*weighted.reduce((a,x)=&gt;a+x.w,0),chosen=weighted[0].e;
 for(const item of weighted){roll-=item.w;if(roll&lt;=0){chosen=item.e;break}}
 const severity=.75+Math.random()*.5;
 const duration=chosen.id==='tornado'?1+Math.round(Math.random()):chosen.id==='tsunami'?2:chosen.id==='cold'?6+Math.round(Math.random()):Math.max(2,Math.min(7,Math.round(chosen.days+(severity-1)*3)));
 const scale=k=&gt;Math.max(.35,Math.min(1.65,1+(chosen[k]-1)*severity));
 S.weather={...chosen,hy:scale('hy'),so:scale('so'),wi:scale('wi'),dm:scale('dm'),severity,days:duration,start:S.t,until:S.t+duration*24};
 S.lastWeatherId=chosen.id;
}

function nextSurge(t){return t+7+Math.random()*8}
function fmtE(v){return v&gt;=1e6?(v/1e6).toFixed(2).replace('.',',')+' M€':Math.round(v/1e3)+' tis. €'}
function thTarget(k,sl){const P=TH[k];return sl&lt;P.min*50?0:Math.max(sl/100,P.min)*CAPOF(k)}
function thermal(k,sl){const P=TH[k],mn=P.min*CAPOF(k),tg=thTarget(k,sl),r=P.ramp*DT;
if(tg===0){S.wu[k]=0;S.th[k]=Math.max(0,S.th[k]-r);return}
if(S.th[k]===0){if(S.wu[k]&lt;P.wu){S.wu[k]++;return}S.th[k]=mn}
S.th[k]+=Math.max(-r,Math.min(r,tg-S.th[k]))}
// Game carbon budget, based on the lifecycle intensities already used by PL.
// Original 100 g/kWh budget raised by 30%, without the later oversized startup reserve.
// No additional reserve is awarded for building more plants or buying another city.
const ENV_INTENSITY=.130,ENV_STARTER_RATE=0,ENV_FINE_PRICE=6,ENV_LEVELS=[1,2,4,8],ENV_WEEKLY=[0,.18,.65,1.8,4.6];
function environmentCalendar(t){const date=new Date(2026,10,6,Math.floor(t));const days=new Date(date.getFullYear(),date.getMonth()+1,0).getDate();return {key:date.getFullYear()+'-'+(date.getMonth()+1),hours:days*24,end:(Date.UTC(date.getFullYear(),date.getMonth()+1,1)-Date.UTC(2026,10,6))/3600000,label:date.toLocaleDateString('sk-SK',{month:'long',year:'numeric'})}}
function environmentPrepare(s,t=s.t){
 const cal=environmentCalendar(t);
 if(!s.environment)s.environment={month:cal.key,monthLabel:cal.label,peak:0,weeklyFine:0,paid:0,lifetime:0,allFines:0,nextFine:null,lastFine:null,damage:0,extremeHours:0,moralePenalty:0,history:[]};
 const e=s.environment;
 if(e.month!==cal.key){e.history.push({month:e.month,label:e.monthLabel,emissions:s.em||0,peak:e.peak,fines:e.paid});if(e.history.length&gt;24)e.history.shift();s.em=0;e.month=cal.key;e.monthLabel=cal.label;e.peak=0;e.currentLevel=0;e.ratio=0;e.smoke=e.damage*.3;e.weeklyFine=0;e.paid=0;e.nextFine=null;e.lastFine=null;}
 const demand=window.parent.PowerplantBridge?.getEnvironmentalDemand?.()||{avgMW:0,population:0,cities:0};
 e.avgMW=Math.max(0,demand.avgMW||0);e.population=demand.population||0;e.cities=demand.cities||0;e.monthEnd=cal.end;e.starterAllowance=e.cities&gt;0?ENV_STARTER_RATE*cal.hours:0;e.demandAllowance=e.avgMW*cal.hours*ENV_INTENSITY;e.limit=e.starterAllowance+e.demandAllowance;e.thresholds=ENV_LEVELS.map(v=&gt;v*e.limit);
 return e;
}

function createDisaster(w){
 const api=map(),st=api?.getState(),build=world.contentWindow?.PowerplantConstruction;
 if(!st||!build)return;
 const coastal=w.id==='tsunami';
 const candidates=st.cities.filter(c=>c.unlocked);
 const city=candidates.length?candidates[Math.floor(Math.random()*candidates.length)]:null;

  item.failed=true;item.actualMW=0;item.heat=0;

 }

 }else showToast(w.icon+' '+w.name+' — v zasiahnutej oblasti neboli žiadne stavby.');

<dialog aria-labelledby="metricModalTitle" id="metricModal"><div class="metric-modal-head"><span class="metric-icon" id="metricModalIcon">€</span><div><h2 id="metricModalTitle"></h2><p id="metricModalSubtitle"></p></div><button aria-label="Zavrieť" id="metricModalClose" type="button">✕</button></div><div class="metric-modal-body" id="metricModalBody"></div></dialog>
<div class="metric-popover" id="metricPopover" role="tooltip"></div>
<script>
// Detailed company metrics: hover summaries and click-through analytics.
const metricNames={nu:'Jadrové',so:'Solárne',hy:'Vodné',wi:'Veterné',cl:'Uhoľné',ga:'Plynové',oi:'Ropné'};
const companyMetrics={lastT:0,lastMoney:null,operatingNet:0,positiveRevenue:0,negativeOperation:0,fuelSpend:0,plantRevenue:{nu:0,so:0,hy:0,wi:0,cl:0,ga:0,oi:0},plantFuel:{nu:0,so:0,hy:0,wi:0,cl:0,ga:0,oi:0},co2History:[],satHistory:[],lastSampleHour:-1,knownFuel:new Map(),lastWorldSeed:null};
const metricModal=document.getElementById('metricModal'),metricBody=document.getElementById('metricModalBody'),metricPopover=document.getElementById('metricPopover');
const fmtEuro=n=>(n<0?'−':'')+new Intl.NumberFormat('sk-SK',{maximumFractionDigits:0}).format(Math.abs(Math.round(n||0)))+' €';
const fmtSigned=n=>(n>=0?'+':'−')+new Intl.NumberFormat('sk-SK',{maximumFractionDigits:0}).format(Math.abs(Math.round(n||0)))+' €';
const card=(label,value,kind='')=>`<div class="metric-card ${kind}"><span>${label}</span><b>${value}</b></div>`;
function currentPlants(){return (world.contentWindow?.PowerplantConstruction?.getItems?.()||[]).filter(p=>metricNames[p.type])}
function investmentBreakdown(){const build=world.contentWindow?.PowerplantConstruction,catalog=build?.catalog||{},items=build?.getItems?.()||[],links=build?.getLinks?.()||[];const out={plants:0,storage:0,switches:0,cables:0,total:0};for(const item of items){const cost=Number(catalog[item.type]?.cost)||0;if(metricNames[item.type])out.plants+=cost;else if(['battery','pumped'].includes(item.type))out.storage+=cost;else if(String(item.type).startsWith('switch')||item.type==='junction')out.switches+=cost}for(const link of links)out.cables+=Number(link.cost)||Number(catalog[link.type]?.cost)||0;out.total=out.plants+out.storage+out.switches+out.cables;return out}
function updateCompanyMetrics(st){if(!st)return;const seed=map()?.getSeed?.();if(seed&&companyMetrics.lastWorldSeed!==seed){companyMetrics.lastWorldSeed=seed;companyMetrics.lastMoney=st.money;companyMetrics.lastT=st.t||0;companyMetrics.knownFuel.clear()}
 const t=Number(st.t)||0,money=Number(st.money)||0,dt=Math.max(0,t-companyMetrics.lastT);if(companyMetrics.lastMoney!==null&&dt>0){const delta=money-companyMetrics.lastMoney;companyMetrics.operatingNet+=delta;if(delta>=0)companyMetrics.positiveRevenue+=delta;else companyMetrics.negativeOperation+=-delta;const plants=currentPlants(),total=plants.reduce((s,p)=>s+Math.max(0,Number(p.actualMW)||0),0);if(delta>0&&total>0)for(const p of plants)companyMetrics.plantRevenue[p.type]+=delta*Math.max(0,Number(p.actualMW)||0)/total}
 const build=world.contentWindow?.PowerplantConstruction;for(const p of currentPlants()){const f=build?.getPlantFuel?.(p.id);if(!f)continue;const old=companyMetrics.knownFuel.get(p.id);if(old&&f.stock>old.stock+0.01){const bought=f.stock-old.stock,spent=bought*f.price;companyMetrics.fuelSpend+=spent;companyMetrics.plantFuel[p.type]+=spent}companyMetrics.knownFuel.set(p.id,{stock:f.stock,type:p.type})}
 companyMetrics.lastMoney=money;companyMetrics.lastT=t;const hour=Math.floor(t);if(hour!==companyMetrics.lastSampleHour){companyMetrics.lastSampleHour=hour;companyMetrics.co2History.push({t,rate:Number(st.emRate)||0,total:Number(st.em)||0});companyMetrics.satHistory.push({t,value:Number(st.sat)||0});if(companyMetrics.co2History.length>720)companyMetrics.co2History.shift();if(companyMetrics.satHistory.length>720)companyMetrics.satHistory.shift()}}
function moneyStats(st){const start=engine()?.getStartMoney?.()||5000000,t=Math.max(0,Number(st.t)||0),today=st.money-st.dayStart,elapsed=Math.max(1,t%24),hourly=today/elapsed,days=[...(st.days||[]),today],avgDay=days.length?days.reduce((a,b)=>a+b,0)/days.length:0;return{start,t,today,hourly,avgDay,month:avgDay*30,total:st.money-start,best:days.length?Math.max(...days):0,worst:days.length?Math.min(...days):0,bestDay:days.length?days.indexOf(Math.max(...days))+1:1,worstDay:days.length?days.indexOf(Math.min(...days))+1:1}}
function popRows(rows){return rows.map(([a,b])=>`<div class="pop-row"><span>${a}</span><b>${b}</b></div>`).join('')}
function positionPopover(target){const r=target.getBoundingClientRect(),w=350;metricPopover.style.left=Math.max(12,Math.min(innerWidth-w-12,r.left+r.width/2-w/2))+'px';metricPopover.style.top=Math.min(innerHeight-metricPopover.offsetHeight-12,r.bottom+9)+'px'}
function showMoneyPopover(target){const st=engine()?.getState();if(!st)return;const q=moneyStats(st);metricPopover.innerHTML='<h4>💶 Financie spoločnosti</h4>'+popRows([['Stav účtu',fmtEuro(st.money)],['Dnes',fmtSigned(q.today)],['Priemer za hodinu',fmtSigned(q.hourly)],['Priemer za deň',fmtSigned(q.avgDay)],['Odhad za mesiac',fmtSigned(q.month)],['Od začiatku',fmtSigned(q.total)]])+'<small>Klikni pre podrobný rozpis</small>';metricPopover.classList.add('visible');positionPopover(target)}
function satisfactionData(){const st=map()?.getState(),cities=st?.cities?.filter(c=>c.unlocked)||[],values=cities.map(c=>Number(c.satisfaction)||0),coverage=cities.map(c=>Math.min(100,(Number(c.suppliedMW)||0)/Math.max(1,map().getDemand(c.id,engine()?.getState()?.t||0))*100));return{cities,avg:values.length?values.reduce((a,b)=>a+b,0)/values.length:100,min:values.length?Math.min(...values):100,max:values.length?Math.max(...values):100,coverage:coverage.length?coverage.reduce((a,b)=>a+b,0)/coverage.length:0}}
function showSatPopover(target){const s=satisfactionData(),st=engine()?.getState();metricPopover.innerHTML='<h4>😊 Spokojnosť obyvateľov</h4>'+popRows([['Celkový priemer',Math.round(s.avg)+' %'],['Najspokojnejšie mesto',Math.round(s.max)+' %'],['Najmenej spokojné mesto',Math.round(s.min)+' %'],['Priemerné pokrytie',Math.round(s.coverage)+' %'],['Zmena za poslednú hodinu',(Number(st?.satBreakdown?.delta)||0).toFixed(2)+' b.']])+'<small>Klikni pre podrobný rozpis miest</small>';metricPopover.classList.add('visible');positionPopover(target)}
function showCo2Popover(target){const st=engine()?.getState(),b=st?.emBreakdown||{};const worst=Object.entries(b).sort((a,c)=>c[1]-a[1])[0];metricPopover.innerHTML='<h4>🌍 Emisie CO₂</h4>'+popRows([['Celkové emisie',Math.round(st?.em||0).toLocaleString('sk-SK')+' t'],['Aktuálne',((st?.emRate||0).toFixed(1))+' t/h'],['Najväčší zdroj',worst?(metricNames[worst[0]]||'Záložný zdroj'):'—'],['Znečistenie ovzdušia',Math.round(st?.air||0)+' t/h']])+'<small>Klikni pre graf a rozpis zdrojov</small>';metricPopover.classList.add('visible');positionPopover(target)}
function hideMetricPopover(){metricPopover.classList.remove('visible')}
function openMetric(title,subtitle,icon,html,draw){document.getElementById('metricModalTitle').textContent=title;document.getElementById('metricModalSubtitle').textContent=subtitle;document.getElementById('metricModalIcon').textContent=icon;metricBody.innerHTML=html;metricModal.showModal();requestAnimationFrame(()=>draw?.())}
function openMoneyDetail(){const st=engine()?.getState();if(!st)return;const q=moneyStats(st),inv=investmentBreakdown(),rows=Object.keys(metricNames).map(k=>{const count=currentPlants().filter(p=>p.type===k).length,gross=companyMetrics.plantRevenue[k],fuel=companyMetrics.plantFuel[k];return count?`<tr><td>${metricNames[k]} (${count}×)</td><td>${fmtEuro(gross)}</td><td>${fmtEuro(-fuel)}</td><td>${fmtSigned(gross-fuel)}</td></tr>`:''}).join('');openMetric('Podrobné financie','Príjmy, výdavky a výsledky spoločnosti','💶',`${economyDetail(st)}<div class="metric-grid">${card('Stav účtu',fmtEuro(st.money),st.money>=0?'positive':'negative')}${card('Dnes',fmtSigned(q.today),q.today>=0?'positive':'negative')}${card('Za hodinu',fmtSigned(q.hourly),q.hourly>=0?'positive':'negative')}${card('Priemer / deň',fmtSigned(q.avgDay),q.avgDay>=0?'positive':'negative')}${card('Priemer / mesiac',fmtSigned(q.month),q.month>=0?'positive':'negative')}${card('Od začiatku',fmtSigned(q.total),q.total>=0?'positive':'negative')}</div><h3 class="metric-section-title">Denné rekordy</h3><div class="metric-grid">${card('Najlepší deň','Deň '+q.bestDay+' · '+fmtSigned(q.best),'positive')}${card('Najslabší deň','Deň '+q.worstDay+' · '+fmtSigned(q.worst),q.worst>=0?'':'negative')}${card('Nákup paliva',fmtEuro(-companyMetrics.fuelSpend),'negative')+card('Emisné pokuty tento mesiac',fmtEuro(-(st.environment?.paid||0)),'negative')}</div><h3 class="metric-section-title">Elektrárne podľa typu</h3>${rows?`<table class="detail-table"><thead><tr><th>Typ</th><th>Príjem</th><th>Palivo</th><th>Výsledok</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="emptyMetric">Zatiaľ nie sú postavené žiadne elektrárne.</div>'}<h3 class="metric-section-title">Investície do siete</h3><div class="metric-grid">${card('Elektrárne',fmtEuro(-inv.plants),'negative')}${card('Úložiská',fmtEuro(-inv.storage),'negative')}${card('Rozvádzače',fmtEuro(-inv.switches),'negative')}${card('Káble',fmtEuro(-inv.cables),'negative')}${card('Spolu vo výstavbe',fmtEuro(-inv.total),'negative')}</div><p class="metric-note">Príjem typov elektrární sa rozdeľuje podľa ich skutočnej výroby. Investície ukazujú hodnotu aktuálne postavených objektov a vedení.</p>`)}
function openSatDetail(){const s=satisfactionData(),rows=[...s.cities].sort((a,b)=>a.satisfaction-b.satisfaction).map(c=>{const need=map().getDemand(c.id,engine()?.getState()?.t||0),coverage=Math.min(100,(c.suppliedMW||0)/Math.max(1,need)*100);return`<tr><td>${c.name}</td><td>${Math.round(c.satisfaction)} %</td><td>${Math.round(coverage)} %</td><td>${Math.round(c.suppliedMW||0)} / ${Math.round(need)} MW</td></tr>`}).join('');openMetric('Spokojnosť obyvateľov','Čo ovplyvňuje náladu v jednotlivých mestách','😊',`<div class="metric-grid">${card('Priemer',Math.round(s.avg)+' %')}${card('Najvyššia',Math.round(s.max)+' %','positive')}${card('Najnižšia',Math.round(s.min)+' %',s.min<60?'negative':'')}${card('Pokrytie spotreby',Math.round(s.coverage)+' %')}</div><h3 class="metric-section-title">Mestá</h3>${rows?`<table class="detail-table"><thead><tr><th>Mesto</th><th>Spokojnosť</th><th>Pokrytie</th><th>Dodávka</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="emptyMetric">Najprv si odomkni mesto.</div>'}<p class="metric-note">Spokojnosť rastie pri stabilnej dodávke elektriny. Nedostatok výkonu, prerušené vedenie a poškodená sieť ju znižujú.</p>`)}
function drawMetricChart(canvas,data,color,valueKey){const r=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);const x=canvas.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);const w=r.width,h=r.height,p=34;x.clearRect(0,0,w,h);x.strokeStyle='#31515a';x.fillStyle='#8fafad';x.font='11px system-ui';for(let i=0;i<5;i++){const y=p+(h-p*2)*i/4;x.beginPath();x.moveTo(p,y);x.lineTo(w-10,y);x.stroke()}if(data.length<2){x.fillText('Graf sa začne kresliť po niekoľkých herných hodinách.',p,h/2);return}const vals=data.map(q=>Number(q[valueKey])||0),max=Math.max(1,...vals),min=Math.min(0,...vals);x.beginPath();data.forEach((q,i)=>{const px=p+i/(data.length-1)*(w-p-12),py=h-p-(vals[i]-min)/(max-min||1)*(h-p*2);i?x.lineTo(px,py):x.moveTo(px,py)});x.strokeStyle=color;x.lineWidth=3;x.stroke();x.fillStyle='#b9d3d0';x.fillText(Math.round(max).toLocaleString('sk-SK'),3,p+4);x.fillText(Math.round(min).toLocaleString('sk-SK'),3,h-p+4)}
function openCo2Detail(){const st=engine()?.getState(),b=st?.emBreakdown||{},rows=Object.entries(b).filter(([,v])=>v>0).sort((a,c)=>c[1]-a[1]).map(([k,v])=>`<tr><td>${metricNames[k]||'Záložný zdroj'}</td><td>${v.toFixed(1)} t/h</td><td>${st.emRate?Math.round(v/st.emRate*100):0} %</td></tr>`).join('');openMetric('Emisie CO₂','Vývoj a pôvod emisií energetickej siete','🌍',`<div class="metric-grid">${card('Celkom',Math.round(st?.em||0).toLocaleString('sk-SK')+' t')}${card('Aktuálny prírastok',(st?.emRate||0).toFixed(1)+' t/h',st?.emRate>500?'negative':'')}${card('Znečistenie ovzdušia',Math.round(st?.air||0)+' t/h')}</div><h3 class="metric-section-title">Vývoj emisií za posledných 30 dní</h3><canvas class="metric-chart" id="co2DetailChart"></canvas><h3 class="metric-section-title">Aktuálne zdroje</h3>${rows?`<table class="detail-table"><thead><tr><th>Zdroj</th><th>Emisie</th><th>Podiel</th></tr></thead><tbody>${rows}</tbody></table>`:'<div class="emptyMetric">Sieť momentálne nevytvára emisie.</div>'}<p class="metric-note">Graf zobrazuje tempo emisií v tonách za hodinu. Mesačné emisie sa na začiatku mesiaca nulujú; celoherný súčet ostáva v detaile.</p>`,()=>drawMetricChart(document.getElementById('co2DetailChart'),companyMetrics.co2History.slice(-720),'#ff9978','rate'))}
function bindMetric(el,hover,click,label){el.classList.add('clickableMetric');el.tabIndex=0;el.setAttribute('role','button');el.setAttribute('aria-label',label);el.addEventListener('mouseenter',()=>hover(el));el.addEventListener('mouseleave',hideMetricPopover);el.addEventListener('focus',()=>hover(el));el.addEventListener('blur',hideMetricPopover);el.addEventListener('click',click);el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();click()}})}
const speedInput=document.getElementById('customSpeed');if(speedInput&&!speedInput.parentElement.classList.contains('speedStepper')){const stepper=document.createElement('span');stepper.className='speedStepper';const minus=document.createElement('button'),plus=document.createElement('button');minus.type=plus.type='button';minus.textContent='−';plus.textContent='+';minus.title='Spomaliť simuláciu';plus.title='Zrýchliť simuláciu';speedInput.parentNode.insertBefore(stepper,speedInput);stepper.append(minus,speedInput,plus);const change=amount=>{const value=Math.max(.1,Math.min(100,(Number(speedInput.value)||1)+amount));speedInput.value=String(Math.round(value*10)/10);speedInput.dispatchEvent(new Event('change',{bubbles:true}))};minus.onclick=()=>change(Number(speedInput.value)<=1?-.1:-1);plus.onclick=()=>change(Number(speedInput.value)<1?.1:1)}
bindMetric(document.getElementById('uiMoney'),showMoneyPopover,openMoneyDetail,'Otvoriť podrobné financie');bindMetric(document.querySelector('.topSatisfaction'),showSatPopover,openSatDetail,'Otvoriť podrobnú spokojnosť');bindMetric(document.getElementById('topEmissions'),showCo2Popover,openCo2Detail,'Otvoriť podrobné emisie CO₂');
document.getElementById('metricModalClose').onclick=()=>metricModal.close();metricModal.addEventListener('click',e=>{if(e.target===metricModal)metricModal.close()});
setInterval(()=>{const st=engine()?.getState();updateCompanyMetrics(st);document.getElementById('uiMoney')?.removeAttribute('title');document.querySelector('.topSatisfaction')?.removeAttribute('title');document.getElementById('topEmissions')?.removeAttribute('title')},750);
</script><script>function environmentalState(){return engine()?.getState()?.environment}
function environmentalDemand(){const api=map(),cities=api?.getCities()?.filter(c=>c.unlocked)||[],climate=1+.06*(environmentalState()?.damage||0);let avgMW=0;for(const c of cities)for(let h=0;h<24;h++)avgMW+=(api.getDemand(c.id,h)||0)/(24*climate);return {avgMW,population:cities.reduce((n,c)=>n+(c.pop||0),0),cities:cities.length}}
window.PowerplantBridge.getEnvironmentalDemand=environmentalDemand;
window.PowerplantBridge.getEnvironmentalImpact=()=>{const e=environmentalState();return {moralePenalty:e?.moralePenalty||0,damage:e?.damage||0}};
window.PowerplantBridge.getProductionEnvironment=()=>{const e=environmentalState(),weather=engine()?.getWeather();return {damage:e?.damage||0,so:weather?.so||1,wi:weather?.wi||1,hy:weather?.hy||1}};
const environmentalNames=['V limite','Prekročený limit','Vysoké emisie','Kritické emisie','Extrémne emisie'];
const environmentalBanner=document.createElement('button');environmentalBanner.id='environmentalBanner';environmentalBanner.type='button';environmentalBanner.hidden=true;environmentalBanner.onclick=()=>openCo2Detail();document.getElementById('shell').append(environmentalBanner);
const environmentalCSS=document.createElement('style');environmentalCSS.textContent='#environmentalBanner{position:absolute;top:82px;left:50%;transform:translateX(-50%);z-index:7;max-width:min(660px,94vw);padding:9px 15px;border:1px solid #ff897b;border-radius:10px;background:#641e25ef;color:#ffe7df;box-shadow:0 4px 22px #16040b66;text-align:left;cursor:pointer;font-size:12px;line-height:1.5}#environmentalBanner[hidden]{display:none}#environmentalBanner strong{display:block;font-size:13px}.environmentalWarning{padding:13px;border:1px solid #b46b4b;border-radius:10px;background:#593b293b;line-height:1.6}.environmentalLimits td,.environmentalLimits th{padding:9px;text-align:left}.environmentalLimits tr.active{background:#7d303a55}.environmentalInfo{padding:10px;border:1px solid #42625e;border-radius:8px;font-size:12px;line-height:1.6;margin:12px 0}';document.head.append(environmentalCSS);
const envTons=v=>Math.round(v||0).toLocaleString('sk-SK')+' t';

function environmentalRefresh(){const s=engine()?.getState(),e=s?.environment;if(!e){environmentalBanner.hidden=true;return}environmentalBanner.hidden=!(e.peak||e.damage>0);if(!environmentalBanner.hidden){environmentalBanner.replaceChildren();const strong=document.createElement('strong');strong.textContent=e.peak?'⚠ '+environmentalNames[e.peak]+' · Pokuta '+euro(e.weeklyFine)+' každých 7 dní':'⚠ Trvalá environmentálna záťaž sveta';const text=document.createElement('div');const next=e.nextFine!==null&&e.nextFine<e.monthEnd?'Ďalšia pokuta o '+Math.max(0,Math.ceil((e.nextFine-s.t)/24))+' dní.':'Ďalšia platba tento mesiac už nie je naplánovaná.';text.textContent=(e.peak?'Zaplatené tento mesiac '+euro(e.paid)+'. '+next+' Stupeň platí do konca mesiaca. ':'')+(e.damage>0?' Trvalé poškodenie: '+Math.round(e.damage*100)+' %. Prejdi na čistú výrobu.':'');environmentalBanner.append(strong,text)}const top=document.getElementById('topEmissions');top.setAttribute('aria-label',environmentSummary(e));const val=document.getElementById('topEmValue');if(val)val.textContent=envCompactTons(s.em);const damageBadge=document.getElementById('ppPermanentDamage');if(damageBadge){damageBadge.textContent='🌱 '+Math.round(e.damage*100)+' %';damageBadge.title='Trvalé poškodenie životného prostredia – klikni na CO₂ pre podrobnosti';}}

const originalCo2Popover=showCo2Popover;

openCo2Detail=function(){const s=engine()?.getState(),e=environmentalState();if(!e){openMetric('Emisie CO₂','Mesačný uhlíkový rozpočet','🌍','<p>Najprv vytvor svet.</p>');return}const rates=[.18,.65,1.8,4.6];const limits=e.thresholds.map((v,i)=>'<tr class="'+(e.peak===i+1?'active':'')+'"><td>'+environmentalNames[i+1]+'</td><td>nad '+envTons(v)+'</td><td>'+euro(Math.round(e.avgMW*168*6*rates[i]))+'</td></tr>').join('');const sources=Object.entries(s.emBreakdown||{}).filter(([,v])=>v>0).map(([k,v])=>'<tr><td>'+(metricNames[k]||k)+'</td><td>'+v.toFixed(1)+' t/h</td></tr>').join('');
 openMetric('Emisie CO₂ · '+e.monthLabel,'Mesačný limit podľa spotreby všetkých vlastnených miest','🌍',`<div class="metric-grid">${card('Tento mesiac',envTons(s.em))}${card('Základný mesačný limit',envTons(e.limit))}${card('Využitie limitu',e.limit?(s.em/e.limit*100).toFixed(1)+' %':'—',e.peak?'negative':'')}${card('Aktuálny prírastok',s.emRate.toFixed(1)+' t/h')}${card('Pokuty tento mesiac',euro(e.paid),'negative')}${card('Emisie od začiatku',envTons(e.lifetime))}</div><p class="environmentalInfo">${environmentSummary(e)}<br>Priemerný denný odber: ${Math.round(e.avgMW).toLocaleString('sk-SK')} MW. Rozpočet = priemerný odber všetkých vlastnených miest × hodiny mesiaca × 0,130 t/MWh (130 g CO₂/kWh). Je o 30 % vyšší než pôvodný rozpočet 100 g/kWh; dodatočná štartovacia rezerva sa už nepripočítava. Ide o herný nízkouhlíkový rozpočet, nie právnu emisnú normu. Počítajú sa aj emisie z nevyužitej nadvýroby.</p><h3>Limity a týždenné pokuty</h3><table class="detail-table environmentalLimits"><thead><tr><th>Stupeň</th><th>Mesačné emisie</th><th>Pokuta / 7 dní</th></tr></thead><tbody>${limits}</tbody></table><p class="metric-note">Prvá pokuta sa odpočíta pri prekročení limitu, ďalšie každých 168 herných hodín. Vyšší stupeň zvýši nasledujúce platby. Prekročený stupeň ani vyrubená suma už tento mesiac neklesnú, ani po rozšírení siete či vypnutí elektrární. Na začiatku ďalšieho kalendárneho mesiaca sa emisie a pokuty za mesiac vynulujú. Celoherný súčet sa uchováva.</p><div class="environmentalWarning">Spokojnosť: pomalý vplyv znečistenia −${e.moralePenalty.toFixed(1)} percentuálneho bodu (cieľ sa približuje počas niekoľkých týždňov).<br>Extrémna záťaž: ${Math.floor(e.extremeHours)} / 168 hodín pred trvalými následkami. Trvalé poškodenie: ${Math.round(e.damage*100)} %. ${e.damage?'Svet sa už mesačným resetom nezotaví. Čistá výroba zastaví ďalšie zhoršovanie; pretrváva vyššie riziko extrémneho počasia a horšie výrobné podmienky.':'Pri dlhodobej extrémnej záťaži pribudnú trvalé následky. Včasný prechod na čistú energiu im predíde.'}</div><h3>Aktuálne zdroje</h3>${sources?'<table class="detail-table"><tbody>'+sources+'</tbody></table>':'<p>Sieť práve nevytvára emisie.</p>'}<h3>Tempo emisií za posledných 30 dní</h3><canvas class="metric-chart" id="co2DetailChart"></canvas><p class="metric-note">Graf ukazuje t/h. Emisné faktory zahŕňajú životný cyklus zdrojov, preto aj čistá výroba má malú stopu. Klimatické následky sú časovo zrýchlená herná mechanika; zvýšené pobrežné riziko predstavujú búrkové prílivové vlny, nie tektonické tsunami.</p>`,()=>drawMetricChart(document.getElementById('co2DetailChart'),companyMetrics.co2History.slice(-720),'#ff9978','rate'));
};

const envCanvas=document.createElement('canvas');envCanvas.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1';envCanvas.id='pollutionLayer';let envAttachedTo=null;const envCtx=envCanvas.getContext('2d');let lastEnvironmentalFrame=0;
function environmentalSmoke(now){
 requestAnimationFrame(environmentalSmoke);
 if(now-lastEnvironmentalFrame<80)return;lastEnvironmentalFrame=now;
 const doc=world.contentDocument,viewport=doc?.getElementById('viewport');
 if(!viewport)return;
 if(envAttachedTo!==viewport){viewport.append(envCanvas);envAttachedTo=viewport;}
 const frame=viewport.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
 if(envCanvas.width!==Math.round(frame.width*dpr)||envCanvas.height!==Math.round(frame.height*dpr)){envCanvas.width=Math.round(frame.width*dpr);envCanvas.height=Math.round(frame.height*dpr)}
 envCtx.setTransform(dpr,0,0,dpr,0,0);envCtx.clearRect(0,0,frame.width,frame.height);
 const e=environmentalState();if(!e)return;
 const damage=Math.max(0,Math.min(1,e.damage||0));
 // Atmosféra sa mení výlučne pri TRVALOM poškodení; aktuálna výroba ani mesačné emisie ju nefarbia.
 if(damage<=0)return;
 const level=damage<.25?1:damage<.5?2:damage<.75?3:4;
 const alpha=[0,.075,.14,.22,.30][level]*Math.min(1,damage/.15);
 envCtx.fillStyle='rgba(113,100,80,'+alpha+')';envCtx.fillRect(0,0,frame.width,frame.height);
 // Rozsiahle pohyblivé vrstvy zákalu, nezávislé od polohy elektrární.
 const patches=level*4;
 for(let n=0;n<patches;n++){
  const x=((n*197+now*(.0018+n%3*.0008))%(frame.width+500))-250;
  const y=((n*131+Math.sin(now/14000+n*2)*60)%(frame.height+320))-160;
  const r=100+level*43+(n%3)*34;
  const g=envCtx.createRadialGradient(x,y,0,x,y,r);
  g.addColorStop(0,'rgba(100,90,78,'+(alpha*.38)+')');
  g.addColorStop(1,'rgba(100,90,78,0)');
  envCtx.fillStyle=g;envCtx.fillRect(x-r,y-r,r*2,r*2);
 }
 // Pri oddialení mapy vidno rozsiahle pohyblivé oblačné pásy.
 // Pri detailnom priblížení ustupujú, aby nezakrývali stavby.
 const zoom=world.contentWindow?.PowerplantMap?.getZoom?.()||1;
 const zoomVisibility=Math.max(0,Math.min(1,(1.05-zoom)/.55));
 const cloudOpacity=zoomVisibility*Math.max(0,(damage-.08))*[0,.22,.33,.45,.57][level];
 if(cloudOpacity>.002){
  envCtx.save();
  const cloudCount=4+level*3;
  for(let n=0;n<cloudCount;n++){
   const size=75+level*30+(n%4)*28;
   const x=((n*251+now*(.0028+(n%3)*.0013))%(frame.width+size*4))-size*2;
   const y=((n*137+Math.sin(now/17000+n*1.7)*28)%(frame.height+size*3))-size*1.5;
   envCtx.save();envCtx.translate(x,y);envCtx.rotate(-.12+(n%4)*.08);
   for(let k=0;k<4;k++){
    const cx=(k-1.5)*size*.32,cy=Math.sin(n*3+k)*size*.14;
    const r=size*(.62+(k%2)*.12);
    const grad=envCtx.createRadialGradient(cx,cy,0,cx,cy,r);
    const a=cloudOpacity*(.65+(k%3)*.12);
    grad.addColorStop(0,'rgba(191,185,166,'+a+')');
    grad.addColorStop(.55,'rgba(163,158,148,'+(a*.48)+')');
    grad.addColorStop(1,'rgba(147,143,137,0)');
    envCtx.fillStyle=grad;envCtx.fillRect(cx-r,cy-r,r*2,r*2);
   }
   envCtx.restore();
  }
  envCtx.restore();
 }
 if(level>=3){
  // Zriedkavé prachové závoje pri ťažkom poškodení.
  envCtx.strokeStyle='rgba(173,140,99,'+(alpha*.42)+')';envCtx.lineWidth=1;
  for(let n=0;n<level*14;n++){
   const x=(n*173+now*.012)%(frame.width+80)-40,y=(n*83+now*.003)%(frame.height+80)-40;
   envCtx.beginPath();envCtx.moveTo(x,y);envCtx.lineTo(x+12+level*5,y-3);envCtx.stroke();
  }
 }
 // Informácia o poškodení je v detaile CO₂, nie nad legendou mapy.

}requestAnimationFrame(environmentalSmoke);

function economyDetail(st){
 const f=st.finance;if(!f)return '';const fine=st.environment?.weeklyFine||0;
 return `<h3 class="metric-section-title">Prevádzka za poslednú hernú hodinu</h3><div class="metric-grid">${card('Predajná cena',f.tariff.toFixed(2)+' €/MWh')}${card('Príjem z dodávok',fmtEuro(f.revenue),'positive')}${card('Prevádzka a údržba',fmtEuro(-f.maintenance),'negative')}${card('Hodnota spotrebovaného paliva',fmtEuro(-f.fuelUseValue),'negative')}${card('Distribúcia a obnova siete',fmtEuro(-f.networkRenewal),'negative')}${card('Povolená marža',f.margin.toFixed(2)+' €/MWh')}${card('Výsledok po spotrebovanom palive',fmtSigned(f.sustainableNet),f.sustainableNet>=0?'positive':'negative')}${card('Po rozpočítaní aktívnej pokuty',fmtSigned(f.sustainableNet-fine/168),f.sustainableNet-fine/168>=0?'positive':'negative')}</div><p class="environmentalInfo">Vyrobené: ${Math.round(f.producedMW)} MW · Dodané mestám: ${Math.round(f.servedMW)} MW · Nedodané: ${Math.round(f.undeliveredMW)} MW.<br>Zarába iba elektrina skutočne dodaná mestám. Nedodaná výroba stále spotrebúva palivo a vytvára emisie. Pri veľkom prebytku zníž výkon alebo rozšír vedenia.<br>Herná marža je najviac 14 €/MWh pri jadre, 12 €/MWh pri ostatných čistých zdrojoch a 9 €/MWh pri fosílnych; pri zmiešanej výrobe sa váži podľa výkonu. Kladný prebytok nad túto maržu odchádza na distribúciu a obnovu siete. Pri strate sa tento poplatok neúčtuje.<br>Palivo platíš pri nákupe; jeho spotrebovaná hodnota je tu uvedená na výpočet udržateľného zisku a druhýkrát sa z účtu neodpočítava. Investície a opravy nie sú zahrnuté v tomto hodinovom výsledku.</p>`;
}

window.PowerplantBridge.recordFuelPurchase=(cost,type)=>engine()?.recordFuelPurchase?.(cost,type);
function financialReport(){return engine()?.getAccounting?.()?.report}
function reportStamp(r){return new Date(2026,10,6,Math.floor(r.t)).toLocaleString('sk-SK',{day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'})}
moneyStats=function(st){const r=st.accounting?.report;if(!r)return {today:0,hourly:0,avgDay:0,month:0,total:0,best:0,worst:0,bestDay:0,worstDay:0};const elapsed=Math.max(1,r.t-r.startT),values=r.days.length?r.days:[0],best=Math.max(...values),worst=Math.min(...values);return {today:r.today,hourly:r.intervalNet||0,avgDay:r.total/elapsed*24,month:r.total/elapsed*720,total:r.total,best,worst,bestDay:values.indexOf(best)+1,worstDay:values.indexOf(worst)+1};};
showMoneyPopover=function(target){const s=engine()?.getState(),r=financialReport();if(!s||!r)return;const q=moneyStats(s);metricPopover.innerHTML='<h4>💶 Financie spoločnosti</h4>'+popRows([['Zostatok účtu',fmtEuro(s.money)],['Prevádzka dnes',fmtSigned(q.today)],['Posledný interval / h',fmtSigned(q.hourly)],['Priemer / deň',fmtSigned(q.avgDay)],['Prevádzka od začiatku',fmtSigned(q.total)]])+'<small>Uzávierka '+reportStamp(r)+' · každých 12 herných hodín. Nákupy a predaje stavieb sa do výsledku nezapočítavajú.</small>';metricPopover.classList.add('visible');positionPopover(target);};
openMoneyDetail=function(){const s=engine()?.getState(),r=financialReport();if(!s||!r)return;const q=moneyStats(s),book=r.cashbook,rows=Object.entries(r.totals.byType).map(([type,row])=>'<tr><td>'+(metricNames[type]||type)+'</td><td>'+fmtEuro(row.revenue)+'</td><td>'+fmtEuro(-row.maintenance-row.networkRenewal-row.fuelUseValue)+'</td><td>'+fmtSigned(row.net)+'</td></tr>').join('');
 const average=r.finance?economyDetail({finance:r.finance,environment:{weeklyFine:r.weeklyFine}}).replace('Prevádzka za poslednú hernú hodinu','Priemer za hodinu · posledný 12-hodinový interval'):'';
 openMetric('Podrobné financie','Uzávierka '+reportStamp(r)+' · aktualizácia každých 12 herných hodín','💶',`<div class="environmentalInfo">Prevádzkové peniaze sa pripisujú o 00:00 a 12:00. Nákupy, predaje a platby za palivo sa z účtu odpočítajú okamžite. Denný výsledok je príjem z dodanej energie mínus prevádzka, spotrebované palivo, distribúcia a emisné pokuty. Nákupy a predaje stavieb, presuny, opravy a jednorazové vylepšenia sú oddelené v investíciách. Palivo sa vo výsledku ráta pri spotrebe, nie druhýkrát pri nákupe.</div><div class="metric-grid">${card('Zostatok účtu',fmtEuro(s.money))}${card('Prevádzka dnes',fmtSigned(q.today),q.today>=0?'positive':'negative')}${card('Včera',r.last===null?'—':fmtSigned(r.last),r.last>=0?'positive':'negative')}${card('Posledný interval / h',fmtSigned(q.hourly),q.hourly>=0?'positive':'negative')}${card('Priemer / deň',fmtSigned(q.avgDay))}${card('Odhad / mesiac',fmtSigned(q.month))}${card('Prevádzka od začiatku',fmtSigned(q.total),q.total>=0?'positive':'negative')}</div>${average}<h3>Jednorazové transakcie · mimo denného výsledku</h3><div class="metric-grid">${card('Nákupy, stavby a vylepšenia',fmtEuro(-book.capitalSpent),'negative')}${card('Predaje a refundácie',fmtEuro(book.capitalReceived),'positive')}${card('Zaplatené za zásoby paliva',fmtEuro(-book.fuelPurchases),'negative')}</div><h3>Prevádzka podľa zdrojov od začiatku</h3>${rows?'<table class="detail-table"><thead><tr><th>Zdroj</th><th>Príjem</th><th>Prevádzka, palivo a distribúcia</th><th>Výsledok pred pokutami</th></tr></thead><tbody>'+rows+'</tbody></table>':'<p>Prvý prevádzkový prehľad bude dostupný pri najbližšej uzávierke.</p>'}<p class="metric-note">Emisné pokuty celkom: ${fmtEuro(r.totals.fines)}. Denné výsledky sa uzatvárajú o polnoci. Peňažný zostatok sa môže zmeniť pri transakcii aj medzi uzávierkami; prevádzkový výsledok transakcia neovplyvní.</p>`);
 metricModal.dataset.financialReport=String(r.t);
};
